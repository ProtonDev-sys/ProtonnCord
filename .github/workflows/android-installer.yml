name: Android installer

on:
    workflow_call:
        secrets:
            ANDROID_SIGNING_KEYSTORE_B64:
                required: false
            ANDROID_SIGNING_PASSWORD:
                required: false

permissions:
    contents: read

jobs:
    Build:
        name: Sign and exercise the Android APK
        if: github.repository == 'ProtonDev-sys/ProtonnCord' && github.ref == 'refs/heads/nightly' && github.event_name != 'pull_request' && vars.ACT != 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 35
        env:
            ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
            PROTONNCORD_KEY_ALIAS: protonncord
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with:
                  distribution: temurin
                  java-version: 21
            - name: Require the persistent production signing identity
              env:
                  ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
                  PROTONNCORD_STORE_PASS: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
                  PROTONNCORD_KEYSTORE: ${{ runner.temp }}/protonncord-release.p12
              run: |
                  python3 -B <<'PY'
                  import base64, binascii, hashlib, os, re, subprocess
                  names = ('ANDROID_SIGNING_KEYSTORE_B64', 'PROTONNCORD_STORE_PASS', 'ANDROID_SIGNER_SHA256')
                  if any(not os.environ.get(name) for name in names):
                      raise SystemExit('APK publication needs secrets ANDROID_SIGNING_KEYSTORE_B64 and ANDROID_SIGNING_PASSWORD, plus variable ANDROID_SIGNER_SHA256. No signing key is generated.')
                  expected = os.environ['ANDROID_SIGNER_SHA256']
                  if not re.fullmatch(r'[a-f0-9]{64}', expected):
                      raise SystemExit('ANDROID_SIGNER_SHA256 must be the lowercase SHA-256 of the production signing certificate.')
                  try:
                      data = base64.b64decode(os.environ['ANDROID_SIGNING_KEYSTORE_B64'], validate=True)
                  except (ValueError, binascii.Error):
                      raise SystemExit('ANDROID_SIGNING_KEYSTORE_B64 must contain a base64-encoded PKCS12 keystore.')
                  if not 0 < len(data) <= 32 * 1024:
                      raise SystemExit('The production PKCS12 keystore has an invalid size.')
                  path = os.environ['PROTONNCORD_KEYSTORE']
                  with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as stream:
                      stream.write(data)
                  result = subprocess.run([os.environ['JAVA_HOME'] + '/bin/keytool', '-exportcert', '-storetype', 'PKCS12',
                      '-keystore', path, '-alias', os.environ['PROTONNCORD_KEY_ALIAS'], '-storepass:env', 'PROTONNCORD_STORE_PASS'],
                      capture_output=True, timeout=30)
                  if result.returncode or hashlib.sha256(result.stdout).hexdigest() != expected:
                      raise SystemExit('The supplied PKCS12 key/alias/password does not match ANDROID_SIGNER_SHA256.')
                  print('Verified the configured production signing certificate.')
                  PY
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: protonncord-mobile
                  path: mobile/build/dist
            - name: Validate this run's unchanged Mobile artifact
              run: python3 -B mobile/tools/validate_release.py mobile/build/dist
            - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
              with:
                  packages: platform-tools
            - run: sdkmanager 'build-tools;36.0.0'
            - name: Build the universal APK from the validated runtime and plugin
              env:
                  PROTONNCORD_STORE_PASS: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
                  PROTONNCORD_KEY_PASS: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
                  PROTONNCORD_KEYSTORE: ${{ runner.temp }}/protonncord-release.p12
              run: |
                  python3 -B mobile/tools/patch_android.py --universal \
                    --plugin mobile/build/dist/uk.co.protonn.secure-messaging.zip \
                    --runtime mobile/build/dist/revenge.bundle \
                    --build-tools "$ANDROID_HOME/build-tools/36.0.0" --output mobile/build/standalone
                  python3 -B <<'PY'
                  import json, os
                  from pathlib import Path
                  receipt = json.loads(Path('mobile/build/standalone/build-receipt.json').read_text())
                  if receipt['signerSha256'] != os.environ['ANDROID_SIGNER_SHA256']:
                      raise SystemExit('The finished APK has an unexpected signer.')
                  receipt['release'] = {key: os.environ[name] for key, name in (
                      ('repository', 'GITHUB_REPOSITORY'), ('runId', 'GITHUB_RUN_ID'),
                      ('runNumber', 'GITHUB_RUN_NUMBER'), ('attempt', 'GITHUB_RUN_ATTEMPT'))}
                  Path('mobile/build/standalone/build-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
                  PY
            - name: Remove private signing material
              if: always()
              run: rm -f "$RUNNER_TEMP/protonncord-release.p12"
            - name: Enable emulator hardware acceleration
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Launch and restart this final APK without an account
              uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
              with:
                  api-level: 35
                  target: google_apis
                  arch: x86_64
                  profile: pixel_7_pro
                  ram-size: 4096M
                  disk-size: 4096M
                  emulator-build: 16428233 # Android Emulator 37.2.12
                  emulator-port: 5554
                  force-avd-creation: true
                  disable-linux-hw-accel: false
                  disable-animations: true
                  emulator-options: -no-window -gpu software -accel on -no-snapshot -noaudio -no-boot-anim -camera-back none
                  script: python3 -B mobile/tools/test_android_client.py --serial emulator-5554 --apk-dir mobile/build/standalone --plugin mobile/build/dist/uk.co.protonn.secure-messaging.zip --runtime mobile/build/dist/revenge.bundle --output mobile/build/reports/android-client
            - name: Retain the tested APK and its verification receipts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ProtonnCord-Android-APK
                  if-no-files-found: error
                  path: |
                      mobile/build/standalone/ProtonnCord.apk
                      mobile/build/standalone/build-receipt.json
                      mobile/build/reports/android-client/result.json
            - name: Retain final-APK diagnostics
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ProtonnCord-Android-APK-Smoke-${{ github.run_attempt }}
                  retention-days: 14
                  if-no-files-found: ignore
                  path: |
                      mobile/build/reports/android-client/**/*.txt
                      mobile/build/reports/android-client/**/*.png
                      mobile/build/reports/android-client/**/*.xml
                      mobile/build/reports/android-client/result.json

    Publish:
        name: Publish the verified Android APK
        needs: Build
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: write
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Require full validation for this revision
              run: node scripts/requireReleaseValidation.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: ProtonnCord-Android-APK
                  path: mobile/build
            - name: Publish only the tested APK
              run: node scripts/publishAndroidInstaller.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}

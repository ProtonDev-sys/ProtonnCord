name: Run hardware identity candidate generator v13

on:
  pull_request:
    branches:
      - nightly
    paths:
      - .trigger-security-key-v13

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/security-key-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/security-key-identity
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Reapply reviewed v12 candidate changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin nightly fix/secure-forwarding
          git show origin/nightly:.github/workflows/run-security-key-generator-v12.yml > /tmp/v12.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/v12.yml').read_text()
          names = [
              'Reapply reviewed v10 candidate changes',
              'Update pending-embed regression',
          ]
          for index, name in enumerate(names):
              marker = f'      - name: {name}\n        shell: bash\n        run: |\n'
              if source.count(marker) != 1:
                  raise SystemExit(f'{name!r} block was not found exactly once')
              payload = source.split(marker, 1)[1].split('\n      - name:', 1)[0]
              output = []
              for line in payload.splitlines():
                  if line.startswith('          '):
                      output.append(line[10:])
                  elif not line.strip():
                      output.append('')
                  else:
                      raise SystemExit(f'unexpected indentation in {name!r}: {line!r}')
              Path(f'/tmp/v12-step-{index}.sh').write_text('\n'.join(output) + '\n')
          PY
          bash -n /tmp/v12-step-0.sh
          bash /tmp/v12-step-0.sh
          bash -n /tmp/v12-step-1.sh
          bash /tmp/v12-step-1.sh

      - name: Correct forwarding markdown regex and remove delivery files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/equicordplugins/secureMessaging.desktop/forwarding.ts')
          source = path.read_text()
          old = '    return value.replace(/[\\\\`*_~|\\[\\]]/gu, "\\\\$&");\n'
          new = '    return value.replace(/[\\\\`*_~|[\\]]/gu, "\\\\$&");\n'
          if source.count(old) != 1:
              raise SystemExit(f'forwarding markdown regex count was {source.count(old)}')
          path.write_text(source.replace(old, new, 1))

          for cleanup in [
              '.github/workflows/run-security-key-generator-v12.yml',
              '.github/workflows/run-security-key-generator-v13.yml',
              '.trigger-security-key-v12',
              '.trigger-security-key-v13',
          ]:
              Path(cleanup).unlink(missing_ok=True)
          PY
          node - <<'NODE'
          const regex = /[\\`*_~|[\]]/gu;
          const input = "a[b]\\`*_|~";
          const matched = [...input.matchAll(regex)].map(match => match[0]).join("");
          if (matched !== "[]\\`*_|~") throw new Error(`unexpected markdown escape regex result: ${matched}`);
          NODE

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused diagnostics
        run: |
          pnpm exec eslint src/equicordplugins/secureMessaging.desktop/forwarding.ts
          pnpm testSecureMessagingOptimisticRendering
          pnpm testSecureMessagingSecurityKey
          pnpm testSecureMessaging
          pnpm testTsc

      - name: Run complete verification gate
        run: |
          pnpm test
          pnpm build
          pnpm testWeb
          git diff --check

      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProtonnCord Nightly CI"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add hardware security-key identity continuity" \
            -m "Bind per-device and per-account Secure Messaging identities to a user-verified roaming WebAuthn credential, add portable public profiles and signed account proofs, retain outgoing render continuity, add encrypted-copy forwarding, clean temporary delivery workflows, and bump nightly to 1.15.1.5."
          git push --force-with-lease origin HEAD:refs/heads/feature/security-key-identity

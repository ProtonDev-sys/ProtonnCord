name: Finalize nightly secure candidate

on:
  push:
    branches:
      - fix/nightly-secure-render-forwarding-v2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify and finalize branch tree
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version": "1.15.1.4"' package.json
          grep -q 'isProvisionalOutgoingMessage' src/equicordplugins/secureMessaging.desktop/optimisticRendering.ts
          grep -q 'guardedSendForwards' src/equicordplugins/secureMessagingForwarding.desktop/index.ts
          corepack enable
          pnpm install --frozen-lockfile
          pnpm testSecureMessagingOptimisticRendering
          pnpm testSecureMessagingForwarding
          pnpm testPluginReleaseMarkers
          pnpm testTsc
          rm -f \
            .nightly-candidate-marker \
            NIGHTLY_CANDIDATE.md \
            .github/SECURE_NIGHTLY_NOTE \
            .github/workflows/apply-nightly-secure-fixes.yml \
            .github/workflows/cleanup-nightly-candidate.yml \
            .github/workflows/finalize-nightly-candidate.yml
          git config user.name "ProtonnCord Nightly CI"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Finalize nightly secure messaging candidate"
            git push origin HEAD:refs/heads/fix/nightly-secure-render-forwarding-v2
          fi

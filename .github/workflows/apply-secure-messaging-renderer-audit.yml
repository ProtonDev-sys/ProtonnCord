name: Apply Secure Messaging renderer audit

on:
    push:
        branches:
            - agent/audit-secure-messaging-performance

permissions:
    contents: write

jobs:
    patch:
        name: Apply Secure Messaging renderer audit
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Apply renderer audit fixes
              run: python scripts/applySecureMessagingRendererAudit.py

            - name: Type-check
              run: pnpm testTsc

            - name: Test Secure Messaging
              run: pnpm testSecureMessaging

            - name: Commit fixes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/equicordplugins/secureMessaging.desktop/index.tsx scripts/applySecureMessagingRendererAudit.py .github/workflows/apply-secure-messaging-renderer-audit.yml
                  git commit -m "perf(secure-messaging): isolate renderer work"
                  git push origin "HEAD:${GITHUB_REF_NAME}"

name: Apply Secure Messaging forward queue fix

on:
    push:
        branches:
            - fix/secure-forward-queue

permissions:
    contents: write

jobs:
    patch:
        if: github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: fix/secure-forward-queue

            - name: Patch guarded REST failures and release metadata
              shell: bash
              run: |
                  set -euo pipefail
                  python <<'PY'
                  from __future__ import annotations

                  import json
                  from pathlib import Path


                  def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
                      file = Path(path)
                      text = file.read_text()
                      count = text.count(old)
                      if count != expected:
                          raise SystemExit(f"{path}: expected {expected} matches, found {count}")
                      file.write_text(text.replace(old, new))


                  index_path = "src/equicordplugins/secureMessaging.desktop/index.tsx"
                  replace_exact(
                      index_path,
                      '} from "./protocol";\nimport {\n    authorizeScopedAttachmentUploadReservations,',
                      '} from "./protocol";\nimport { settleGuardedRestFailure } from "./restGuardFailure";\nimport {\n    authorizeScopedAttachmentUploadReservations,',
                  )
                  replace_exact(
                      index_path,
                      '        const guardedRequest = await protectProgrammaticPost(request);\n',
                      '        let guardedRequest: Record<string, any>;\n'
                      '        try {\n'
                      '            guardedRequest = await protectProgrammaticPost(request);\n'
                      '        } catch (error) {\n'
                      '            return settleGuardedRestFailure(error, args);\n'
                      '        }\n',
                  )
                  replace_exact(
                      index_path,
                      '        const guardedRequest = await protectProgrammaticPatch(request);\n',
                      '        let guardedRequest: Record<string, any>;\n'
                      '        try {\n'
                      '            guardedRequest = await protectProgrammaticPatch(request);\n'
                      '        } catch (error) {\n'
                      '            return settleGuardedRestFailure(error, args);\n'
                      '        }\n',
                  )
                  replace_exact(
                      index_path,
                      '            throw error;\n        }\n    };',
                      '            return settleGuardedRestFailure(error, args);\n        }\n    };',
                      expected=2,
                  )

                  package_path = Path("package.json")
                  package = json.loads(package_path.read_text())
                  if package.get("version") != "1.15.1.1":
                      raise SystemExit(f"unexpected package version: {package.get('version')}")
                  package["version"] = "1.15.1.2"
                  scripts = package["scripts"]
                  scripts["testSecureMessagingRestGuard"] = "tsx scripts/testSecureMessagingRestGuard.ts"
                  test_command = scripts["test"]
                  needle = "pnpm testSecureMessaging &&"
                  if test_command.count(needle) != 1:
                      raise SystemExit("could not place Secure Messaging REST guard test")
                  scripts["test"] = test_command.replace(
                      needle,
                      "pnpm testSecureMessagingRestGuard && pnpm testSecureMessaging &&",
                  )
                  package_path.write_text(json.dumps(package, indent=4) + "\n")

                  replace_exact(
                      "src/components/settings/tabs/plugins/newPluginRelease.ts",
                      '    plugins: ["AutoJumpToMessage", "WebPWA"],\n    version: "1.15.1.1",',
                      '    plugins: [],\n    version: "1.15.1.2",',
                  )

                  marker_path = Path("scripts/testPluginReleaseMarkers.ts")
                  marker_text = marker_path.read_text()
                  start_marker = (
                      'assert.equal(NEW_PLUGIN_RELEASE.version, packageJson.version, '
                      '"the New marker manifest must be updated with every version bump");\n'
                  )
                  start = marker_text.index(start_marker) + len(start_marker)
                  end = marker_text.index("\nconst pluginSettings", start)
                  marker_assertions = '''assert.equal(
                      getReleaseNewPlugins(packageJson.version, ["AutoJumpToMessage", "WebPWA", "SecureMessaging"]),
                      null,
                      "a patch release must not keep the previous release's New markers",
                  );
                  assert.equal(
                      getReleaseNewPlugins("1.15.1.1", ["AutoJumpToMessage", "WebPWA"]),
                      null,
                      "New markers must disappear as soon as the release version is bumped",
                  );
                  assert.equal(
                      getReleaseNewPlugins("1.15.1.3", ["AutoJumpToMessage"]),
                      null,
                      "versions without an explicit release manifest must not create phantom cards",
                  );
                  '''
                  marker_path.write_text(marker_text[:start] + marker_assertions + marker_text[end:])

                  source = Path(index_path).read_text()
                  if source.count("return settleGuardedRestFailure(error, args);") != 4:
                      raise SystemExit("expected four callback-safe REST guard failure paths")
                  PY

            - name: Commit fix
              shell: bash
              run: |
                  set -euo pipefail
                  git config user.name "ProtonnCord Fix"
                  git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
                  git rm .github/workflows/one-shot-secure-forward-fix.yml
                  git add package.json scripts/testPluginReleaseMarkers.ts scripts/testSecureMessagingRestGuard.ts \
                      src/components/settings/tabs/plugins/newPluginRelease.ts \
                      src/equicordplugins/secureMessaging.desktop/index.tsx \
                      src/equicordplugins/secureMessaging.desktop/restGuardFailure.ts
                  git diff --cached --check
                  git commit -m "fix(secure-messaging): drain blocked forward requests"
                  git push origin HEAD:fix/secure-forward-queue

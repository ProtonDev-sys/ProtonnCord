name: Apply secure upload fix

on:
    push:
        branches:
            - agent/fix-secure-message-image-upload

permissions:
    contents: write

jobs:
    patch:
        name: Apply encrypted attachment upload fix
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Patch secure upload coordination
              run: |
                  python - <<'PY'
                  from pathlib import Path

                  INDEX = "src/equicordplugins/secureMessaging.desktop/index.tsx"
                  TEST = "scripts/testSecureMessaging.ts"

                  def block(*lines: str) -> str:
                      return "\n".join(lines) + "\n"

                  def replace_once(path: str, old: str, new: str) -> None:
                      file = Path(path)
                      source = file.read_text()
                      count = source.count(old)
                      if count != 1:
                          raise SystemExit(f"Expected one match in {path}, found {count}: {old.splitlines()[0]!r}")
                      file.write_text(source.replace(old, new, 1))

                  replace_once(
                      INDEX,
                      block(
                          "        let protection: ConversationProtection;",
                          "        try {",
                          "            protection = await resolveConversationProtection(this.channelId);",
                          "        } catch {",
                          "            return;",
                          "        }",
                          "        if (generation !== attachmentGuardGeneration) return;",
                      ),
                      block(
                          "        let protection: ConversationProtection;",
                          "        try {",
                          "            protection = await resolveConversationProtection(this.channelId);",
                          "        } catch (error) {",
                          "            if (approval) throw error;",
                          "            return;",
                          "        }",
                          "        if (generation !== attachmentGuardGeneration) {",
                          "            if (approval) throw new Error(\"Secure Messaging cancelled an encrypted attachment upload after its guard changed\");",
                          "            return;",
                          "        }",
                      ),
                  )

                  replace_once(
                      INDEX,
                      block(
                          '            if (approval.file !== this.item.file || approval.scope !== scope || screenCaptureProtectionStatus !== "ready" ||',
                          '                protection.kind !== "snapshot" || isNativeFailure(protection.conversation) ||',
                          '                protection.conversation.status !== "enabled" ||',
                          "                hasSelectedKeyReviewBlock(protection.context.localUserId, protection.conversation)) {",
                          "                approvedAttachmentUploads.delete(this);",
                          "                return;",
                          "            }",
                      ),
                      block(
                          '            if (approval.file !== this.item.file || approval.scope !== scope || screenCaptureProtectionStatus !== "ready" ||',
                          '                protection.kind !== "snapshot" || isNativeFailure(protection.conversation) ||',
                          '                protection.conversation.status !== "enabled" ||',
                          "                hasSelectedKeyReviewBlock(protection.context.localUserId, protection.conversation)) {",
                          "                approvedAttachmentUploads.delete(this);",
                          "                throw new Error(\"Secure Messaging blocked an encrypted attachment upload after its conversation changed\");",
                          "            }",
                      ),
                  )

                  replace_once(
                      INDEX,
                      block(
                          "        if (detachedTextIndex !== null) {",
                          "            options.uploads = uploads;",
                          "            options.attachmentsToUpload = uploads;",
                          "        }",
                      ),
                      block(
                          "        if (preparedAttachments) {",
                          "            options.uploads = uploads;",
                          "            options.attachmentsToUpload = uploads;",
                          "        }",
                      ),
                  )

                  replace_once(
                      INDEX,
                      block(
                          "        if (preparedAttachments)",
                          "            authorizeScopedAttachmentUploadReservations(channelId, preparedAttachments.files, scope);",
                          "        authorizeScopedWirePayload(channelId, encrypted.content, attachmentFilenames, scope);",
                          "        rememberOptimisticOutgoingPlaintext(encrypted.content, plaintext);",
                          "        message.content = encrypted.content;",
                          "        preparedOutgoingMessages.set(message, { ciphertext: encrypted.content, plaintext });",
                          "        for (const upload of uploads) approvedAttachmentUploads.set(upload, { file: upload.item.file, scope });",
                          "        generatedDetachedUploadCommitted = true;",
                      ),
                      block(
                          "        if (preparedAttachments)",
                          "            authorizeScopedAttachmentUploadReservations(channelId, preparedAttachments.files, scope);",
                          "        for (const upload of uploads) approvedAttachmentUploads.set(upload, { file: upload.item.file, scope });",
                          "        if (preparedAttachments) {",
                          "            try {",
                          "                await Promise.all(uploads.map(upload => upload.upload()));",
                          "            } catch (error) {",
                          "                for (const upload of uploads) approvedAttachmentUploads.delete(upload);",
                          "                throw error;",
                          "            }",
                          "            if (!secureOperationIsCurrent(generation, context.localUserId)) return { cancel: true };",
                          "        }",
                          "        authorizeScopedWirePayload(channelId, encrypted.content, attachmentFilenames, scope);",
                          "        rememberOptimisticOutgoingPlaintext(encrypted.content, plaintext);",
                          "        message.content = encrypted.content;",
                          "        preparedOutgoingMessages.set(message, { ciphertext: encrypted.content, plaintext });",
                          "        generatedDetachedUploadCommitted = true;",
                      ),
                  )

                  replace_once(
                      INDEX,
                      block('            : "Secure Messaging stopped the send because encryption failed unexpectedly.", Toasts.Type.FAILURE);'),
                      block('            : "Secure Messaging stopped the send because encryption or upload failed unexpectedly.", Toasts.Type.FAILURE);'),
                  )

                  test_anchor = block(
                      "    assert.match(",
                      "        outgoingListenerSource,",
                      r'        /resolveConversationProtection\(channelId\)[\s\S]{0,200}protection\.kind === "unprotected"\) return/,',
                      '        "ordinary DMs bypass encrypted send handling while the hardware vault is locked",',
                      "    );",
                  )
                  test_addition = block(
                      "    const attachmentUploadGuardSource = rendererSource.slice(",
                      '        rendererSource.indexOf("function installAttachmentUploadGuard"),',
                      '        rendererSource.indexOf("function uninstallAttachmentUploadGuard"),',
                      "    );",
                      "    assert.match(",
                      "        attachmentUploadGuardSource,",
                      r"        /catch \(error\) \{\s*if \(approval\) throw error;/,",
                      '        "approved encrypted uploads surface protection failures instead of pretending to finish",',
                      "    );",
                      '    const attachmentReservationIndex = outgoingListenerSource.indexOf("authorizeScopedAttachmentUploadReservations");',
                      '    const attachmentApprovalIndex = outgoingListenerSource.indexOf("approvedAttachmentUploads.set");',
                      '    const attachmentStartIndex = outgoingListenerSource.indexOf("await Promise.all(uploads.map(upload => upload.upload()))");',
                      "    assert.ok(",
                      "        attachmentReservationIndex !== -1 && attachmentApprovalIndex > attachmentReservationIndex &&",
                      "        attachmentStartIndex > attachmentApprovalIndex,",
                      '        "encrypted attachments are authorized, approved, and explicitly started in order",',
                      "    );",
                      "    assert.match(",
                      "        outgoingListenerSource,",
                      r"        /if \(preparedAttachments\) \{\s*options\.uploads = uploads;\s*options\.attachmentsToUpload = uploads;/,",
                      '        "every encrypted attachment set is handed back to Discord\'s upload pipeline",',
                      "    );",
                  )
                  replace_once(TEST, test_anchor, test_anchor + test_addition)

                  Path(".github/workflows/apply-secure-upload-fix.yml").unlink()
                  PY

            - name: Commit fix
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/equicordplugins/secureMessaging.desktop/index.tsx scripts/testSecureMessaging.ts .github/workflows/apply-secure-upload-fix.yml
                  git commit -m "fix(secure-messaging): resume encrypted attachment uploads"
                  git push origin "HEAD:${GITHUB_REF_NAME}"

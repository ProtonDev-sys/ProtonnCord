name: Harden integrated security-key vault candidate v5

on:
  pull_request:
    branches:
      - nightly
    paths:
      - .trigger-security-key-vault-hardening-v5

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/security-key-vault'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/security-key-vault
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Apply deterministic fail-safe locking
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_block(text: str, start_marker: str, end_marker: str, replacement: str, label: str) -> str:
              if text.count(start_marker) != 1:
                  raise SystemExit(f"{label}: start marker count was {text.count(start_marker)}")
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement.rstrip() + "\n" + text[end:]

          native_path = Path('src/equicordplugins/secureMessaging.desktop/native.ts')
          native = replace_block(
              native_path.read_text(),
              'export async function lockSecurityKeyVault(',
              '\nexport async function removeSecurityKeyVault',
              '''export async function lockSecurityKeyVault(
              event: IpcMainInvokeEvent,
          ): Promise<SecurityKeyVaultResult> {
              const callerFailure = validateIpcCaller(event);
              if (callerFailure) return callerFailure;

              // Locking is a memory-safety boundary. Clear private material before any filesystem,
              // mutex, or safeStorage operation that could fail or wait.
              clearSecurityKeyVaultSession();
              cachedVault = null;
              clearAuthenticatedAttachmentCache();

              return runSerialized(async (): Promise<SecurityKeyVaultResult> => {
                  const envelope = parseSecurityKeyVaultEnvelope(await readVaultStoredValue());
                  return envelope
                      ? { status: "locked", profile: securityKeyVaultProfileSummary(envelope.profile) }
                      : { status: "not_configured" };
              });
          }''',
              'lockSecurityKeyVault',
          )
          native_path.write_text(native)

          renderer_path = Path('src/equicordplugins/secureMessaging.desktop/index.tsx')
          renderer = replace_block(
              renderer_path.read_text(),
              '    const runKeyAction = async (',
              '\n\n    const toggleRecipient',
              '''    const runKeyAction = async (operation: () => Promise<SecurityKeyVaultResult>) => {
              setBusy(true);
              setError(null);
              try {
                  const result = await operation();
                  if (isNativeFailure(result)) {
                      setError(failureMessage(result));
                  } else {
                      setSecurityKey(result);
                      revokePreparedSecureOperations();
                      invalidateSecureRenderCaches();
                      await load();
                  }
              } catch {
                  setError("The security-key operation failed.");
              } finally {
                  setBusy(false);
              }
          };''',
              'runKeyAction',
          )
          renderer_path.write_text(renderer)

          test_path = Path('scripts/testSecureMessagingSecurityKey.ts')
          test = test_path.read_text()
          anchor = '    assert.match(native, /lockSecurityKeyVault/u);\n'
          if 'locking must clear the in-memory E2E key' not in test:
              if test.count(anchor) != 1:
                  raise SystemExit(f"lock assertion count was {test.count(anchor)}")
              test = test.replace(
                  anchor,
                  anchor +
                  '    const lockFunctionStart = native.indexOf("export async function lockSecurityKeyVault");\n'
                  '    const lockFunctionEnd = native.indexOf("export async function removeSecurityKeyVault", lockFunctionStart);\n'
                  '    const lockFunction = native.slice(lockFunctionStart, lockFunctionEnd);\n'
                  '    assert.ok(\n'
                  '        lockFunction.indexOf("clearSecurityKeyVaultSession();") < lockFunction.indexOf("return runSerialized"),\n'
                  '        "locking must clear the in-memory E2E key before fallible storage or mutex work",\n'
                  '    );\n',
                  1,
              )
          test_path.write_text(test)

          for cleanup in [
              '.trigger-security-key-vault-hardening-v3',
              '.trigger-security-key-vault-hardening-v4',
              '.trigger-security-key-vault-hardening-v5',
          ]:
              Path(cleanup).unlink(missing_ok=True)
          PY
          git add -A

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused security checks
        run: |
          pnpm lint:fix
          pnpm testSecureMessagingSecurityKey
          pnpm testSecureMessagingNative
          pnpm testTsc
          pnpm lint-styles

      - name: Run complete verification gate
        run: |
          pnpm test
          pnpm build
          pnpm testWeb
          git diff --check

      - name: Commit exact verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProtonnCord Nightly CI"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make security-key vault locking fail-safe" \
            -m "Clear the in-memory E2E vault key before any fallible lock or storage work, retain the previous modal state after cancelled security-key operations so users can retry, and verify the boundary in the full test gates."
          git push --force-with-lease origin HEAD:refs/heads/feature/security-key-vault

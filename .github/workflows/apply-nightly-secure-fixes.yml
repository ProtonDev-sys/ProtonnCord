name: Apply nightly secure fixes

on:
  push:
    branches:
      - fix/nightly-secure-render-forwarding-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Build, verify, and publish candidate branch
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin nightly fix/secure-forwarding
          git switch --detach origin/nightly
          git switch -c generated-nightly-secure-fixes
          git checkout origin/fix/secure-forwarding -- \
            src/equicordplugins/secureMessaging.desktop/forwarding.ts \
            src/equicordplugins/secureMessagingForwarding.desktop/index.ts

          cat > src/equicordplugins/secureMessaging.desktop/optimisticRendering.ts <<'EOF'
          /*
           * Vencord, a Discord client mod
           * Copyright (c) 2026 Protonn Cord contributors
           * SPDX-License-Identifier: GPL-3.0-or-later
           */

          const MAX_OPTIMISTIC_PLAINTEXTS = 128;
          const OPTIMISTIC_PLAINTEXT_TTL_MS = 60_000;

          interface OptimisticPlaintextEntry {
              expiresAt: number;
              plaintext: string;
          }

          const optimisticPlaintexts = new Map<string, OptimisticPlaintextEntry>();

          function pruneOptimisticPlaintexts(now: number): void {
              for (const [ciphertext, entry] of optimisticPlaintexts) {
                  if (entry.expiresAt <= now) optimisticPlaintexts.delete(ciphertext);
              }
              while (optimisticPlaintexts.size > MAX_OPTIMISTIC_PLAINTEXTS) {
                  const oldest = optimisticPlaintexts.keys().next().value;
                  if (typeof oldest !== "string") break;
                  optimisticPlaintexts.delete(oldest);
              }
          }

          export function rememberOptimisticOutgoingPlaintext(
              ciphertext: string,
              plaintext: string,
              now = Date.now(),
          ): void {
              pruneOptimisticPlaintexts(now);
              optimisticPlaintexts.delete(ciphertext);
              optimisticPlaintexts.set(ciphertext, {
                  expiresAt: now + OPTIMISTIC_PLAINTEXT_TTL_MS,
                  plaintext,
              });
              pruneOptimisticPlaintexts(now);
          }

          export function getOptimisticOutgoingPlaintext(ciphertext: string, now = Date.now()): string | undefined {
              pruneOptimisticPlaintexts(now);
              const entry = optimisticPlaintexts.get(ciphertext);
              if (!entry) return undefined;
              optimisticPlaintexts.delete(ciphertext);
              optimisticPlaintexts.set(ciphertext, entry);
              return entry.plaintext;
          }

          export function isProvisionalOutgoingMessage(messageId: string, nonce: string | null): boolean {
              return nonce === messageId;
          }

          export function settleOptimisticOutgoingPlaintext(
              ciphertext: string,
              messageId: string,
              nonce: string | null,
          ): void {
              // Discord first renders locally authored messages under the request nonce and then replaces the
              // row with the canonical server ID. Clearing at the provisional stage creates a blank render
              // between those two records. Keep the plaintext until the canonical record has authenticated.
              if (!isProvisionalOutgoingMessage(messageId, nonce)) optimisticPlaintexts.delete(ciphertext);
          }

          export function clearOptimisticOutgoingPlaintexts(): void {
              optimisticPlaintexts.clear();
          }

          export function optimisticOutgoingPlaintextCountForTest(now = Date.now()): number {
              pruneOptimisticPlaintexts(now);
              return optimisticPlaintexts.size;
          }
          EOF

          cat > scripts/testSecureMessagingOptimisticRendering.ts <<'EOF'
          /*
           * Vencord, a Discord client mod
           * Copyright (c) 2026 Protonn Cord contributors
           * SPDX-License-Identifier: GPL-3.0-or-later
           */

          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          import { shouldHideSecureEmbedOnlyPlaintext } from "../src/equicordplugins/secureMessaging.desktop/embedUrls";
          import {
              clearOptimisticOutgoingPlaintexts,
              getOptimisticOutgoingPlaintext,
              isProvisionalOutgoingMessage,
              optimisticOutgoingPlaintextCountForTest,
              rememberOptimisticOutgoingPlaintext,
              settleOptimisticOutgoingPlaintext,
          } from "../src/equicordplugins/secureMessaging.desktop/optimisticRendering";

          const provisionalId = "1460000000000000000";
          const canonicalId = "1460000000000000001";
          const ciphertext = "PCEM3:optimistic-render-fixture";

          clearOptimisticOutgoingPlaintexts();
          rememberOptimisticOutgoingPlaintext(ciphertext, "visible immediately", 1_000);
          assert.equal(getOptimisticOutgoingPlaintext(ciphertext, 1_001), "visible immediately");
          assert.equal(isProvisionalOutgoingMessage(provisionalId, provisionalId), true);
          settleOptimisticOutgoingPlaintext(ciphertext, provisionalId, provisionalId);
          assert.equal(
              getOptimisticOutgoingPlaintext(ciphertext, 1_002),
              "visible immediately",
              "the provisional optimistic row must not consume the plaintext needed by the canonical row",
          );

          assert.equal(isProvisionalOutgoingMessage(canonicalId, provisionalId), false);
          settleOptimisticOutgoingPlaintext(ciphertext, canonicalId, provisionalId);
          assert.equal(
              getOptimisticOutgoingPlaintext(ciphertext, 1_003),
              undefined,
              "the canonical authenticated row must release optimistic plaintext",
          );

          rememberOptimisticOutgoingPlaintext(ciphertext, "expires", 5_000);
          assert.equal(getOptimisticOutgoingPlaintext(ciphertext, 64_999), "expires");
          assert.equal(getOptimisticOutgoingPlaintext(ciphertext, 65_000), undefined);

          clearOptimisticOutgoingPlaintexts();
          for (let index = 0; index < 160; index++)
              rememberOptimisticOutgoingPlaintext(`PCEM3:${index}`, String(index), 100_000 + index);
          assert.equal(optimisticOutgoingPlaintextCountForTest(100_200), 128, "optimistic plaintext retention must stay bounded");
          assert.equal(getOptimisticOutgoingPlaintext("PCEM3:0", 100_200), undefined, "oldest entries must be evicted first");
          assert.equal(getOptimisticOutgoingPlaintext("PCEM3:159", 100_200), "159");

          assert.equal(shouldHideSecureEmbedOnlyPlaintext("https://example.com/video", "pending"), false,
              "a pending embed must keep its URL visible instead of creating an empty message row");
          assert.equal(shouldHideSecureEmbedOnlyPlaintext("https://example.com/video", "present"), true);
          assert.equal(shouldHideSecureEmbedOnlyPlaintext("https://example.com/video", "absent"), false);

          const renderer = readFileSync(new URL(
              "../src/equicordplugins/secureMessaging.desktop/index.tsx",
              import.meta.url,
          ), "utf8");
          assert.match(renderer, /getOptimisticOutgoingPlaintext\(message\.content\)/u);
          assert.match(renderer, /settleOptimisticOutgoingPlaintext\([\s\S]*discordMessageNonce\(message\)/u);
          assert.doesNotMatch(renderer, /optimisticOutgoingPlaintexts\.delete/u,
              "render effects must not delete optimistic plaintext before checking the provisional nonce");

          console.log("Secure Messaging optimistic rendering checks passed");
          EOF

          cat > scripts/testSecureMessagingForwarding.ts <<'EOF'
          /*
           * Vencord, a Discord client mod
           * Copyright (c) 2026 Protonn Cord contributors
           * SPDX-License-Identifier: GPL-3.0-or-later
           */

          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          import {
              composeSecureForwardText,
              sanitizeForwardMentions,
              secureForwardEmbedText,
              secureForwardRoute,
              validatedDiscordAttachmentUrl,
          } from "../src/equicordplugins/secureMessaging.desktop/forwarding";

          const unprotected = { protected: false, ready: false } as const;
          const protectedReady = { protected: true, ready: true } as const;
          const protectedBlocked = { protected: true, ready: false, reason: "not ready" } as const;

          assert.equal(secureForwardRoute(unprotected, unprotected), "native");
          assert.equal(secureForwardRoute(unprotected, protectedReady), "secure");
          assert.equal(secureForwardRoute(protectedReady, protectedReady), "secure");
          assert.equal(secureForwardRoute(protectedReady, unprotected), "blocked");
          assert.equal(secureForwardRoute(unprotected, protectedBlocked), "blocked");

          const sanitized = sanitizeForwardMentions(
              "hello <@123456789012345678> <@&223456789012345678> <#323456789012345678> @everyone @here",
              {
                  user: () => "Alice",
                  role: () => "Moderators",
                  channel: () => "general",
              },
          );
          assert.equal(sanitized.includes("<@"), false);
          assert.equal(sanitized.includes("@everyone"), false);
          assert.equal(sanitized.includes("@here"), false);
          assert.match(sanitized, /@\u200bAlice/u);
          assert.match(sanitized, /@\u200bModerators/u);
          assert.match(sanitized, /#general/u);

          const embedText = secureForwardEmbedText([
              { title: "ignored when a URL exists", url: "https://example.com/video" },
              { title: "Text card", description: "description" },
          ], [0]);
          assert.equal(embedText, "https://example.com/video");

          const composed = composeSecureForwardText({
              authorLabel: "A *sender*",
              content: "source text <@123456789012345678>",
              embeds: [{ video: { url: "https://example.com/watch?v=1" } }],
              mentionResolvers: { user: () => "Alice" },
              timestampMs: 1_780_000_000_000,
          });
          assert.match(composed, /Forwarded copy from A \\*sender\\\*/u);
          assert.match(composed, /source text @\u200bAlice/u);
          assert.match(composed, /https:\/\/example\.com\/watch\?v=1/u);
          assert.doesNotMatch(composed, /message_reference|messageReference/u);

          const validAttachment = validatedDiscordAttachmentUrl(
              "https://cdn.discordapp.com/attachments/123456789012345678/223456789012345678/file.png?ex=1",
              "123456789012345678",
              "223456789012345678",
          );
          assert.ok(validAttachment);
          assert.equal(validatedDiscordAttachmentUrl(
              "https://evil.example/attachments/123456789012345678/223456789012345678/file.png",
              "123456789012345678",
              "223456789012345678",
          ), null);
          assert.equal(validatedDiscordAttachmentUrl(
              "https://cdn.discordapp.com/attachments/999456789012345678/223456789012345678/file.png",
              "123456789012345678",
              "223456789012345678",
          ), null);

          const runtime = readFileSync(new URL(
              "../src/equicordplugins/secureMessagingForwarding.desktop/index.ts",
              import.meta.url,
          ), "utf8");
          assert.match(runtime, /actions\.sendForward = guardedSendForward/u);
          assert.match(runtime, /actions\.sendForwards = guardedSendForwards/u);
          assert.match(runtime, /for \(const destinationChannelId of new Set\(destinationChannelIds\)\)/u);
          assert.match(runtime, /const selective = options\.onlyAttachmentIds !== undefined \|\| options\.onlyEmbedIndices !== undefined/u);
          assert.match(runtime, /const attachmentSelection = selective \? rawAttachmentSelection \?\? new Set<string>\(\) : null/u);
          assert.match(runtime, /const embedSelection = selective \? rawEmbedSelection \?\? \[\] : undefined/u);
          assert.match(runtime, /secureForwardRoute\(source, destination\)/u);
          assert.match(runtime, /await secureForward\(message, destinationChannelId, options\)/u);
          assert.match(runtime, /await sendMessage\(destinationChannelId/u);
          assert.doesNotMatch(runtime, /message_reference|messageReference|alsoForwardToChannelId/u,
              "secure forwarding must create a new encrypted message without a Discord source reference");
          assert.doesNotMatch(runtime, /credentials:\s*["']include["']/u,
              "attachment downloads must not attach Discord renderer credentials");

          console.log("Secure Messaging forwarding checks passed");
          EOF


name: Run hardware identity candidate generator v9

on:
  pull_request:
    branches:
      - nightly
    paths:
      - .trigger-security-key-v9

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/security-key-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/security-key-identity
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Reapply reviewed v8 candidate changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin nightly fix/secure-forwarding
          git show origin/nightly:.github/workflows/run-security-key-generator-v8.yml > /tmp/v8.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/v8.yml').read_text()
          names = [
              'Reapply focused reviewed candidate',
              'Apply deterministic type-safety corrections',
          ]
          for index, name in enumerate(names):
              marker = f'      - name: {name}\n        shell: bash\n        run: |\n'
              if source.count(marker) != 1:
                  raise SystemExit(f'{name!r} block was not found exactly once')
              payload = source.split(marker, 1)[1].split('\n      - name:', 1)[0]
              output = []
              for line in payload.splitlines():
                  if line.startswith('          '):
                      output.append(line[10:])
                  elif not line.strip():
                      output.append('')
                  else:
                      raise SystemExit(f'unexpected indentation in {name!r}: {line!r}')
              Path(f'/tmp/v8-step-{index}.sh').write_text('\n'.join(output) + '\n')
          PY
          bash -n /tmp/v8-step-0.sh
          bash /tmp/v8-step-0.sh
          bash -n /tmp/v8-step-1.sh
          bash /tmp/v8-step-1.sh

      - name: Correct the two remaining TypeScript narrowings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          ui_path = Path('src/equicordplugins/secureMessagingSecurityKey.desktop/index.tsx')
          ui = replace_once(
              ui_path.read_text(),
              '    const security = security;\n',
              '    const security = review.security;\n',
              'proof security declaration',
          )
          ui_path.write_text(ui)

          native_path = Path('src/equicordplugins/secureMessagingSecurityKey.desktop/native.ts')
          native = replace_once(
              native_path.read_text(),
              '        transports.some((transport, index) => transport !== value.transports[index])) return null;\n',
              '        transports.some((transport, index) => transport !== (value.transports as unknown[])[index])) return null;\n',
              'transport element narrowing',
          )
          native_path.write_text(native)

          for path in [
              '.github/workflows/run-security-key-generator-v9.yml',
              '.trigger-security-key-v9',
          ]:
              Path(path).unlink(missing_ok=True)
          PY

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused diagnostics
        run: |
          pnpm testSecureMessagingOptimisticRendering
          pnpm testSecureMessagingSecurityKey
          pnpm testTsc

      - name: Run complete verification gate
        run: |
          pnpm test
          pnpm build
          pnpm testWeb
          git diff --check

      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProtonnCord Nightly CI"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add hardware security-key identity continuity" \
            -m "Bind per-device and per-account Secure Messaging identities to a user-verified roaming WebAuthn credential, add portable public profiles and signed account proofs, retain outgoing render continuity, add encrypted-copy forwarding, clean temporary delivery workflows, and bump nightly to 1.15.1.5."
          git push --force-with-lease origin HEAD:refs/heads/feature/security-key-identity

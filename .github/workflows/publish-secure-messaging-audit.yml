name: Publish Secure Messaging audit

on:
    push:
        branches:
            - agent/audit-secure-messaging-performance

permissions:
    contents: write

jobs:
    publish:
        name: Validate and publish audited files
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Apply audited changes
              run: |
                  python scripts/applySecureMessagingPerformanceTest.py
                  python scripts/fixSecureMessagingAuditTypecheck.py

            - name: Validate audited changes
              run: |
                  pnpm testSecureMessagingPerformance
                  pnpm testTsc
                  pnpm testSecureMessaging

            - name: Publish code changes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git restore --source=HEAD -- .github/workflows/apply-secure-messaging-performance-test.yml .github/workflows/test.yml scripts/applySecureMessagingPerformanceTest.py scripts/fixSecureMessagingAuditTypecheck.py
                  git add -A
                  if git diff --cached --quiet; then
                      exit 0
                  fi
                  git commit -m "perf(secure-messaging): finalize isolation audit"
                  git push origin "HEAD:${GITHUB_REF_NAME}"

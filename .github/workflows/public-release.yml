name: Downloadable release
on:
    workflow_dispatch:
    push:
        tags: ['v*']

permissions:
    contents: read

concurrency:
    group: downloadable-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    package:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Verify tracked-file privacy
              run: pnpm checkPrivacy
            - name: Scan Git history for secrets
              run: |
                  curl --fail --location --silent --show-error --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
                  echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --strict
                  tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
                  /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts=--all
            - name: Build production desktop and browser
              run: |
                  export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
                  pnpm buildStandalone
                  pnpm buildWebStandalone
            - name: Test installer verification and changed fixtures
              run: |
                  pnpm testInstallerSecurity
                  pnpm testDiscordMcp
                  pnpm testMessageLoggerNativeWrites
                  pnpm testTsc
                  pnpm exec tsx --test scripts/testAuditSecureLiveIsolation.ts
            - name: Package downloadable archives
              run: pnpm packageRelease
            - name: Verify downloadable archive contents and checksums
              run: pnpm testPublicRelease
            - name: Verify archive privacy
              run: /tmp/gitleaks dir dist/public-release --config .gitleaks.toml --redact --no-banner --max-archive-depth=2
            - uses: actions/upload-artifact@v7
              with:
                  name: public-release
                  path: dist/public-release/*
                  if-no-files-found: error
            - name: Publish versioned release
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  test "$GITHUB_REF_NAME" = "$version"
                  gh release create "$version" --verify-tag --title "Protonn Cord ${version#v}" --notes-file scripts/release/notes.md dist/public-release/*

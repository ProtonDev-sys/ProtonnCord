name: Publish current nightly 1.15.1.8

on:
    pull_request:
        branches:
            - nightly
        paths:
            - .trigger-publish-nightly-1-15-1-8

permissions:
    contents: write

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ github.token }}
    RELEASE_COMMIT: afe658b128497a8a4b192567682abde8f131f1cc
    RELEASE_TREE: 8b43315d0014d982c6d3961eadf07335aa16bf8b

jobs:
    publish:
        if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/nightly-1.15.1.8'
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.RELEASE_COMMIT }}
                  fetch-depth: 0

            - name: Verify exact tested source
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
                  test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"
                  test "$(node -p "require('./package.json').version")" = "1.15.1.8"

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile

            - name: Build standalone web assets
              run: pnpm buildWebStandalone

            - name: Build standalone desktop assets
              run: pnpm buildStandalone

            - name: Generate release metadata
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect release files
              shell: bash
              run: |
                  set -euo pipefail
                  cd dist
                  mkdir release
                  shopt -s nullglob

                  cp browser/browser.* release
                  cp ProtonnCord.user.{js,js.LEGAL.txt} release

                  release_files=(*.json *.zip *.asar)
                  if (( ${#release_files[@]} )); then
                      cp "${release_files[@]}" release
                  fi

                  cp desktop/* release
                  for file in equibop/*; do
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done

                  find release -type f -size 0 -delete
                  rm -f release/package.json release/*.map
                  test -n "$(find release -maxdepth 1 -type f -print -quit)"

            - name: Publish mutable nightly channel
              shell: bash
              run: |
                  set -euo pipefail
                  git fetch --no-tags origin nightly
                  current_tree=$(git show "FETCH_HEAD^{tree}" --format=%T --no-patch)
                  if [[ "$current_tree" != "$RELEASE_TREE" ]] && ! git diff --quiet "$RELEASE_COMMIT" FETCH_HEAD -- . ':!.github/workflows/publish-current-nightly.yml'; then
                      echo "nightly source changed after verification; refusing to publish stale assets"
                      exit 1
                  fi

                  if gh release view nightly >/dev/null 2>&1; then
                      git tag --force nightly "$RELEASE_COMMIT"
                      git push origin refs/tags/nightly --force
                      gh release edit nightly --target "$RELEASE_COMMIT" \
                          --title "Protonn Cord nightly $RELEASE_COMMIT" --prerelease
                  else
                      gh release create nightly --target "$RELEASE_COMMIT" \
                          --title "Protonn Cord nightly $RELEASE_COMMIT" \
                          --notes "Automatically built from the fully verified Protonn Cord nightly source." --prerelease
                  fi
                  gh release upload nightly --clobber dist/release/*
                  test "$(git ls-remote origin refs/tags/nightly | cut -f1)" = "$RELEASE_COMMIT"

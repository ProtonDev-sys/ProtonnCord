name: Test
on:
    push:
        branches:
            - main
            - dev
            - nightly
            - staging
            - "agent/**"
    pull_request:
        branches:
            - main
            - dev
            - nightly
            - staging

jobs:
    Test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test Secure Messaging crypto caches
              run: pnpm exec tsx scripts/testSecureMessagingCryptoCache.ts

            - name: Test Secure Messaging layout stability
              run: pnpm exec tsx scripts/testSecureMessagingLayoutStability.ts

            - name: Test Secure Messaging performance boundaries
              run: pnpm testSecureMessagingPerformance

            - name: Benchmark Secure Messaging
              run: pnpm exec tsx scripts/benchmarkSecureMessaging.ts

            - name: Lint & Test if desktop version compiles
              run: pnpm test

            - name: Test if web version compiles
              run: pnpm buildWeb

            - name: Test if plugin structure is valid
              run: pnpm generatePluginJson

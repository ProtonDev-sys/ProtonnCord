name: Test
on:
    push:
        branches:
            - main
            - dev
            - nightly
            - staging
            - "agent/**"
    pull_request:
        branches:
            - main
            - dev
            - nightly
            - staging

permissions:
    contents: write

jobs:
    FinalizeFormatting:
        name: Finalize formatter-only newline
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/sync-equicord-1.15.1' && github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - name: Apply formatter output
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  python3 - <<'PY'
                  from pathlib import Path

                  target = Path("src/equicordplugins/secureMessaging.desktop/crypto.ts")
                  content = target.read_bytes()
                  if not content.endswith(b"\n"):
                      target.write_bytes(content + b"\n")
                  PY
                  git show "$BASE_SHA:.github/workflows/test.yml" > .github/workflows/test.yml
                  git diff --check

            - name: Commit formatter output
              shell: bash
              run: |
                  set -euo pipefail
                  git config user.name "ProtonnCord Formatter"
                  git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
                  git add --all
                  git commit -m "style: apply final formatter output"
                  git push origin HEAD:${{ github.head_ref }}

    Test:
        name: Test
        if: github.event_name != 'pull_request' || github.head_ref != 'agent/sync-equicord-1.15.1' || github.actor == 'github-actions[bot]'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test Secure Messaging crypto caches
              run: pnpm exec tsx scripts/testSecureMessagingCryptoCache.ts

            - name: Test Secure Messaging layout stability
              run: pnpm exec tsx scripts/testSecureMessagingLayoutStability.ts

            - name: Benchmark Secure Messaging
              run: pnpm exec tsx scripts/benchmarkSecureMessaging.ts

            - name: Lint & Test if desktop version compiles
              run: pnpm test

            - name: Test if web version compiles
              run: pnpm buildWeb

            - name: Test if plugin structure is valid
              run: pnpm generatePluginJson

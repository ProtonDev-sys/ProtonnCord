name: Test
on:
    workflow_dispatch:
    push:
        branches:
            - main
            - dev
            - nightly
            - staging
            - "agent/**"
    pull_request:
        branches:
            - main
            - dev
            - nightly
            - staging

permissions:
    contents: read

jobs:
    Test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Use Node.js 24
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit shipped dependencies
              run: pnpm audit --prod

            - name: Test Secure Messaging crypto caches
              run: pnpm exec tsx scripts/testSecureMessagingCryptoCache.ts

            - name: Test Secure Messaging layout stability
              run: pnpm exec tsx scripts/testSecureMessagingLayoutStability.ts

            - name: Benchmark Secure Messaging
              run: pnpm exec tsx scripts/benchmarkSecureMessaging.ts

            - name: Build production desktop test inputs
              run: pnpm build

            - name: Test desktop, lint, and regression suites
              run: pnpm test

            - name: Test primary stream audio and promise timeouts
              run: pnpm testPrimaryStreamAudio && pnpm testPromiseTimeout

            - name: Test if web version compiles
              run: pnpm buildWeb

            - name: Test the generated API type package
              run: |
                  pnpm generateTypes
                  pnpm --dir packages/vencord-types test

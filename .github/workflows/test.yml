name: Test
on:
    push:
        branches:
            - main
            - dev
            - nightly
            - staging
            - "agent/**"
    pull_request:
        branches:
            - main
            - dev
            - nightly
            - staging

permissions:
    contents: write

jobs:
    ApplyReleaseChanges:
        name: Apply ProtonnCord 1.15.1.1 changes
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/sync-equicord-1.15.1' && github.actor != 'github-actions[bot]'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref }}

            - name: Apply deterministic release changes
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  python3 - <<'PY'
                  from pathlib import Path

                  script = Path(".github/scripts/apply_release_changes.py")
                  content = script.read_text(encoding="utf-8")
                  start = content.index("# Stable, staging, and nightly standalone release channels.")
                  end = content.index("# Follow the upstream removal", start)
                  script.write_text(content[:start] + content[end:], encoding="utf-8")
                  PY
                  python3 .github/scripts/apply_release_changes.py
                  git diff --check
                  git show "$BASE_SHA:.github/workflows/test.yml" > .github/workflows/test.yml

            - name: Commit generated release changes
              shell: bash
              run: |
                  set -euo pipefail
                  git config user.name "ProtonnCord Release Automation"
                  git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
                  git rm -f --ignore-unmatch .github/scripts/apply_release_changes.py .github/workflows/apply-release-changes.yml
                  git add --all
                  git commit -m "feat: add updater channels and release-scoped plugin markers"
                  git push origin HEAD:${{ github.head_ref }}

    Test:
        name: Test
        if: github.event_name != 'pull_request' || github.head_ref != 'agent/sync-equicord-1.15.1' || github.actor == 'github-actions[bot]'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test Secure Messaging crypto caches
              run: pnpm exec tsx scripts/testSecureMessagingCryptoCache.ts

            - name: Test Secure Messaging layout stability
              run: pnpm exec tsx scripts/testSecureMessagingLayoutStability.ts

            - name: Benchmark Secure Messaging
              run: pnpm exec tsx scripts/benchmarkSecureMessaging.ts

            - name: Lint & Test if desktop version compiles
              run: pnpm test

            - name: Test if web version compiles
              run: pnpm buildWeb

            - name: Test if plugin structure is valid
              run: pnpm generatePluginJson

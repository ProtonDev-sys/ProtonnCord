name: Run hardware identity candidate generator v4

on:
  pull_request:
    branches:
      - nightly
    paths:
      - .trigger-security-key-v4

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/security-key-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/security-key-identity
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Apply reviewed candidate source changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin nightly fix/secure-forwarding
          git checkout origin/fix/secure-forwarding -- \
            src/equicordplugins/secureMessaging.desktop/forwarding.ts \
            src/equicordplugins/secureMessagingForwarding.desktop/index.ts

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def exact_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str, flags: int = 0) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one regex match, got {count}")
              return updated

          renderer_path = Path("src/equicordplugins/secureMessaging.desktop/index.tsx")
          renderer = renderer_path.read_text()
          if 'from "./optimisticRendering"' not in renderer:
              renderer = exact_once(
                  renderer,
                  'import { discordEditedTimestamp } from "./messageMetadata";',
                  'import { discordEditedTimestamp, discordMessageNonce } from "./messageMetadata";',
                  "message metadata import",
              )
              renderer = exact_once(
                  renderer,
                  'import type {\n    AnnouncementReviewResult,',
                  'import {\n    clearOptimisticOutgoingPlaintexts,\n    getOptimisticOutgoingPlaintext,\n    rememberOptimisticOutgoingPlaintext,\n    settleOptimisticOutgoingPlaintext,\n} from "./optimisticRendering";\nimport type {\n    AnnouncementReviewResult,',
                  "optimistic helper import",
              )
              renderer = exact_once(
                  renderer,
                  'const optimisticOutgoingPlaintexts = new Map<string, string>();\n',
                  '',
                  "old optimistic map",
              )
              renderer = regex_once(
                  renderer,
                  r'function rememberOptimisticOutgoingPlaintext\(ciphertext: string, plaintext: string\): void \{.*?\n\}\n\n',
                  '',
                  "old optimistic helper",
                  re.S,
              )
              clear_count = renderer.count('optimisticOutgoingPlaintexts.clear();')
              if clear_count < 1:
                  raise SystemExit("old optimistic clear was not found")
              renderer = renderer.replace('optimisticOutgoingPlaintexts.clear();', 'clearOptimisticOutgoingPlaintexts();')
              renderer = exact_once(
                  renderer,
                  '? optimisticOutgoingPlaintexts.get(message.content)\n',
                  '? getOptimisticOutgoingPlaintext(message.content)\n',
                  "optimistic getter",
              )
              delete_line = '            optimisticOutgoingPlaintexts.delete(message.content);'
              if renderer.count(delete_line) != 2:
                  raise SystemExit(f"optimistic settlement lines: expected 2, got {renderer.count(delete_line)}")
              renderer = renderer.replace(
                  delete_line,
                  '            settleOptimisticOutgoingPlaintext(message.content, message.id, discordMessageNonce(message));',
              )

          if 'SECURITY_KEY_PROOF_PREFIX' not in renderer:
              renderer = exact_once(
                  renderer,
                  'import { settleGuardedRestFailure } from "./restGuardFailure";',
                  'import { SECURITY_KEY_PROOF_PREFIX } from "../secureMessagingSecurityKey.desktop/protocol";\nimport { settleGuardedRestFailure } from "./restGuardFailure";',
                  "security-key protocol import",
              )
          if 'visiblePlaintext?.startsWith(SECURITY_KEY_PROOF_PREFIX)' not in renderer:
              function_start = renderer.index('function EncryptedMessageAccessory')
              tail = renderer[function_start:]
              target = '    }, [captureProtection, key, localUserId]);\n\n    if (captureProtection !== "ready") {\n'
              if tail.count(target) != 1:
                  raise SystemExit(f"security-key renderer insertion point count was {tail.count(target)}")
              replacement = '    }, [captureProtection, key, localUserId]);\n\n    if (visiblePlaintext?.startsWith(SECURITY_KEY_PROOF_PREFIX)) return null;\n\n    if (captureProtection !== "ready") {\n'
              tail = tail.replace(target, replacement, 1)
              renderer = renderer[:function_start] + tail
          renderer_path.write_text(renderer)

          embed_path = Path("src/equicordplugins/secureMessaging.desktop/embedUrls.ts")
          embed = embed_path.read_text()
          if 'inlineEmbedStatus === "present"' not in embed:
              embed = exact_once(
                  embed,
                  '    return inlineEmbedStatus !== "absent" && secureEmbedOnlyUrl(plaintext) !== null;',
                  '    // Keep the URL visible until a real local embed exists; otherwise the outgoing row goes blank while unfurling.\n    return inlineEmbedStatus === "present" && secureEmbedOnlyUrl(plaintext) !== null;',
                  "pending embed visibility",
              )
          embed_path.write_text(embed)

          forward_path = Path("src/equicordplugins/secureMessagingForwarding.desktop/index.ts")
          forward = forward_path.read_text()
          if 'type SendForwards =' not in forward:
              forward = exact_once(
                  forward,
                  '''type SendForward = (message: Message, destinationChannelId: string, options?: ForwardOptions) => Promise<void>;

          interface ForwardActions {
              sendForward: SendForward;
              sendForwards(message: Message, destinationChannelIds: string[], options?: ForwardOptions): Promise<void>;
          }
          ''',
                  '''type SendForward = (message: Message, destinationChannelId: string, options?: ForwardOptions) => Promise<void>;
          type SendForwards = (message: Message, destinationChannelIds: string[], options?: ForwardOptions) => Promise<void>;

          interface ForwardActions {
              sendForward: SendForward;
              sendForwards: SendForwards;
          }
          ''',
                  "forward action types",
              )
          if 'function secureMessagingPlugin()' not in forward:
              forward = exact_once(
                  forward,
                  '''interface PreparedForward {
              plaintext: string;
              stickerIds: string[];
              uploads: ForwardUpload[];
          }

          let generation = 0;
          let patchedActions: ForwardActions | null = null;
          let originalSendForward: SendForward | null = null;
          let guardedSendForward: SendForward | null = null;
          ''',
                  '''interface PreparedForward {
              plaintext: string;
              stickerIds: string[];
              uploads: ForwardUpload[];
          }

          interface SecureMessagingPluginState {
              getScreenCaptureProtectionStatus?(): string;
              started?: boolean;
          }

          let generation = 0;
          let patchedActions: ForwardActions | null = null;
          let originalSendForward: SendForward | null = null;
          let originalSendForwards: SendForwards | null = null;
          let guardedSendForward: SendForward | null = null;
          let guardedSendForwards: SendForwards | null = null;

          function secureMessagingPlugin(): SecureMessagingPluginState | undefined {
              return (plugins as unknown as Record<string, SecureMessagingPluginState>).SecureMessaging;
          }
          ''',
                  "forward globals",
              )
          forward = regex_once(
              forward,
              r'function secureMessagingRuntimeReady\(\): boolean \{.*?\n\}',
              '''function secureMessagingRuntimeReady(): boolean {
              const plugin = secureMessagingPlugin();
              return plugin?.started === true && plugin.getScreenCaptureProtectionStatus?.() === "ready";
          }''',
              "forward runtime readiness",
              re.S,
          )
          if 'Show encrypted content and enable Secure Messaging before forwarding this message.' not in forward:
              forward = exact_once(
                  forward,
                  '''async function inspectProtection(channelId: string, knownEncryptedMessage = false): Promise<ForwardProtection> {
              if (knownEncryptedMessage) return { protected: true, ready: secureMessagingRuntimeReady() };
          ''',
                  '''async function inspectProtection(channelId: string, knownEncryptedMessage = false): Promise<ForwardProtection> {
              if (knownEncryptedMessage) {
                  const ready = secureMessagingRuntimeReady();
                  return {
                      protected: true,
                      ready,
                      reason: ready ? undefined : "Show encrypted content and enable Secure Messaging before forwarding this message.",
                  };
              }
          ''',
                  "encrypted source readiness",
              )
          if 'await reader.cancel().catch(() => undefined);' not in forward:
              read_start = forward.index('async function readBoundedResponse')
              read_end = forward.index('\nasync function fetchCandidate', read_start)
              read_block = forward[read_start:read_end]
              read_block = exact_once(
                  read_block,
                  '''    } finally {
              reader.releaseLock();
          }
          ''',
                  '''    } catch (error) {
              await reader.cancel().catch(() => undefined);
              throw error;
          } finally {
              reader.releaseLock();
          }
          ''',
                  "bounded response cancellation",
              )
              forward = forward[:read_start] + read_block + forward[read_end:]
          if 'const rawAttachmentSelection =' not in forward:
              forward = exact_once(
                  forward,
                  '''async function secureForward(message: Message, destinationChannelId: string, options: ForwardOptions = {}): Promise<void> {
              const attachmentSelection = normalizeAttachmentSelection(options.onlyAttachmentIds);
              const embedSelection = normalizeEmbedSelection(options.onlyEmbedIndices);
              const selective = attachmentSelection !== null || embedSelection !== undefined;
              const embeds = (message.embeds ?? []) as unknown as ForwardEmbed[];
          ''',
                  '''async function secureForward(message: Message, destinationChannelId: string, options: ForwardOptions = {}): Promise<void> {
              const rawAttachmentSelection = normalizeAttachmentSelection(options.onlyAttachmentIds);
              const rawEmbedSelection = normalizeEmbedSelection(options.onlyEmbedIndices);
              const selective = options.onlyAttachmentIds !== undefined || options.onlyEmbedIndices !== undefined;
              const attachmentSelection = selective ? rawAttachmentSelection ?? new Set<string>() : null;
              const embedSelection = selective ? rawEmbedSelection ?? [] : undefined;
              const embeds = (message.embeds ?? []) as unknown as ForwardEmbed[];
          ''',
                  "forward component selection",
              )
          if 'const forwardedContent = composeSecureForwardText' not in forward:
              forward = exact_once(
                  forward,
                  '''    const content = composeSecureForwardText({
              attachmentSelection: attachmentSelection === null ? undefined : [...attachmentSelection],
              authorLabel: authorLabel(message),
              content: prepared.plaintext,
              embedSelection,
              embeds,
              mentionResolvers: mentionResolvers(message),
              timestampMs: timestampMs(message),
          });
          const uploads = prepared.uploads.map(upload => cloudUpload(destinationChannelId, upload));
          await sendMessage(destinationChannelId, { content }, false, {
              attachmentsToUpload: uploads,
              stickerIds: prepared.stickerIds,
              uploads,
          } as never);

          const note = typeof options.withMessage === "string" ? options.withMessage.trim() : "";
          if (note) await sendMessage(destinationChannelId, { content: note }, false);
          ''',
                  '''    const forwardedContent = composeSecureForwardText({
              attachmentSelection: attachmentSelection === null ? undefined : [...attachmentSelection],
              authorLabel: authorLabel(message),
              content: prepared.plaintext,
              embedSelection,
              embeds,
              mentionResolvers: mentionResolvers(message),
              timestampMs: timestampMs(message),
          });
          const note = typeof options.withMessage === "string" ? options.withMessage.trim() : "";
          const content = [note, forwardedContent].filter(Boolean).join("\\n\\n");
          const uploads = prepared.uploads.map(upload => cloudUpload(destinationChannelId, upload));
          await sendMessage(destinationChannelId, { content }, false, {
              attachmentsToUpload: uploads,
              stickerIds: prepared.stickerIds,
              uploads,
          } as never);
          ''',
                  "combined forward note",
              )
          if 'guardedSendForwards = async function' not in forward:
              forward = regex_once(
                  forward,
                  r'function installForwardGuard\(actions: ForwardActions, expectedGeneration: number\): void \{.*?\n\}\n\nfunction uninstallForwardGuard\(\): void \{.*?\n\}',
                  '''async function routeForward(
              actions: ForwardActions,
              original: SendForward,
              expectedGeneration: number,
              message: Message,
              destinationChannelId: string,
              options?: ForwardOptions,
          ): Promise<void> {
              if (expectedGeneration !== generation || secureMessagingPlugin()?.started !== true)
                  return original.call(actions, message, destinationChannelId, options);
              const [source, destination] = await Promise.all([
                  inspectProtection(message.channel_id, isEncryptedMessage(message.content)),
                  inspectProtection(destinationChannelId),
              ]);
              const route = secureForwardRoute(source, destination);
              if (route === "native") return original.call(actions, message, destinationChannelId, options);
              if (route === "blocked") {
                  const reason = destination.protected && !destination.ready
                      ? destination.reason
                      : "Protected messages can only be forwarded into another enabled protected conversation.";
                  showToast(reason ?? "Secure Messaging blocked the forward safely.", Toasts.Type.FAILURE);
                  return;
              }
              showToast("Preparing encrypted forward…", Toasts.Type.MESSAGE);
              await secureForward(message, destinationChannelId, options);
              showToast("Forwarded as a new encrypted message.", Toasts.Type.SUCCESS);
          }

          function installForwardGuard(actions: ForwardActions, expectedGeneration: number): void {
              if (expectedGeneration !== generation || patchedActions) return;
              const original = actions.sendForward;
              const originalMany = actions.sendForwards;
              if (typeof original !== "function" || typeof originalMany !== "function") return;
              originalSendForward = original;
              originalSendForwards = originalMany;
              guardedSendForward = async function (message, destinationChannelId, options) {
                  try {
                      await routeForward(actions, original, expectedGeneration, message, destinationChannelId, options);
                  } catch (error) {
                      showToast(
                          error instanceof Error ? error.message : "Secure Messaging could not forward this message safely.",
                          Toasts.Type.FAILURE,
                      );
                  }
              };
              guardedSendForwards = async function (message, destinationChannelIds, options) {
                  if (expectedGeneration !== generation)
                      return originalMany.call(actions, message, destinationChannelIds, options);
                  if (!Array.isArray(destinationChannelIds) ||
                      destinationChannelIds.some(channelId => typeof channelId !== "string" || !SNOWFLAKE.test(channelId))) {
                      showToast("Discord supplied invalid forwarding destinations.", Toasts.Type.FAILURE);
                      return;
                  }
                  for (const destinationChannelId of new Set(destinationChannelIds))
                      await guardedSendForward!.call(actions, message, destinationChannelId, options);
              };
              actions.sendForward = guardedSendForward;
              actions.sendForwards = guardedSendForwards;
              patchedActions = actions;
          }

          function uninstallForwardGuard(): void {
              generation++;
              if (patchedActions && guardedSendForward && originalSendForward && patchedActions.sendForward === guardedSendForward)
                  patchedActions.sendForward = originalSendForward;
              if (patchedActions && guardedSendForwards && originalSendForwards && patchedActions.sendForwards === guardedSendForwards)
                  patchedActions.sendForwards = originalSendForwards;
              patchedActions = null;
              originalSendForward = null;
              originalSendForwards = null;
              guardedSendForward = null;
              guardedSendForwards = null;
          }''',
                  "forward interception",
                  re.S,
              )
          forward_path.write_text(forward)

          security_ui_path = Path("src/equicordplugins/secureMessagingSecurityKey.desktop/index.tsx")
          security_ui = security_ui_path.read_text()
          if 'serializeSecurityKeyProof,' not in security_ui:
              security_ui = exact_once(
                  security_ui,
                  '    parseSecurityKeyProof,\n    type SecurityKeyProof,',
                  '    parseSecurityKeyProof,\n    serializeSecurityKeyProof,\n    type SecurityKeyProof,',
                  "security proof serializer import",
              )
          if 'SECURITY_KEY_PROOF_PREFIX + JSON.stringify' in security_ui:
              security_ui = regex_once(
                  security_ui,
                  r'SECURITY_KEY_PROOF_PREFIX \+ JSON\.stringify\(\[.*?\]\),\n            message\.id,',
                  'serializeSecurityKeyProof(proof),\n            message.id,',
                  "canonical proof review content",
                  re.S,
              )
          security_ui_path.write_text(security_ui)

          security_native_path = Path("src/equicordplugins/secureMessagingSecurityKey.desktop/native.ts")
          security_native = security_native_path.read_text().replace(
              '            userIds: [discordAuthorId],',
              '            userIds: [],',
          )
          security_native_path.write_text(security_native)

          security_test_path = Path("scripts/testSecureMessagingSecurityKey.ts")
          security_test = security_test_path.read_text()
          if 'type KeyObject,' not in security_test:
              security_test = exact_once(
                  security_test,
                  '    generateKeyPairSync,\n    sign,',
                  '    generateKeyPairSync,\n    type KeyObject,\n    sign,',
                  "test KeyObject import",
              )
              security_test = regex_once(
                  security_test,
                  r'privateKey: ReturnType<typeof generateKeyPairSync>\["privateKey"\];',
                  'privateKey: KeyObject;',
                  "test private-key type",
              )
          security_test_path.write_text(security_test)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          if package["version"] not in {"1.15.1.3", "1.15.1.4", "1.15.1.5"}:
              raise SystemExit(f"unexpected package version {package['version']}")
          package["version"] = "1.15.1.5"
          scripts = package["scripts"]
          scripts["testSecureMessagingForwarding"] = "tsx scripts/testSecureMessagingForwarding.ts"
          scripts["testSecureMessagingOptimisticRendering"] = "tsx scripts/testSecureMessagingOptimisticRendering.ts"
          scripts["testSecureMessagingSecurityKey"] = "tsx scripts/testSecureMessagingSecurityKey.ts"
          combined = "pnpm testSecureMessagingOptimisticRendering && pnpm testSecureMessagingForwarding && pnpm testSecureMessagingSecurityKey && pnpm testSecureMessagingRestGuard"
          if combined not in scripts["test"]:
              needle = "pnpm testMainProcessStdio && pnpm testSecureMessagingRestGuard"
              if scripts["test"].count(needle) != 1:
                  raise SystemExit("full test-chain insertion point is missing")
              scripts["test"] = scripts["test"].replace(
                  needle,
                  "pnpm testMainProcessStdio && " + combined,
                  1,
              )
          package_path.write_text(json.dumps(package, indent=4, ensure_ascii=False) + "\n")

          marker_path = Path("src/components/settings/tabs/plugins/newPluginRelease.ts")
          marker = marker_path.read_text()
          marker, count = re.subn(r'version: "1\.15\.1\.[2345]"', 'version: "1.15.1.5"', marker, count=1)
          if count != 1:
              raise SystemExit("plugin release marker version was not updated")
          marker_path.write_text(marker)

          marker_test_path = Path("scripts/testPluginReleaseMarkers.ts")
          marker_test = marker_test_path.read_text()
          marker_test, count = re.subn(
              r'getReleaseNewPlugins\("1\.15\.1\.[456]", \["AutoJumpToMessage"\]\)',
              'getReleaseNewPlugins("1.15.1.6", ["AutoJumpToMessage"])',
              marker_test,
              count=1,
          )
          if count != 1:
              raise SystemExit("plugin marker no-phantom version was not updated")
          marker_test_path.write_text(marker_test)

          for name in [
              ".github/SECURE_NIGHTLY_NOTE",
              ".github/workflows/apply-nightly-secure-fixes.yml",
              ".github/workflows/cleanup-nightly-candidate.yml",
              ".github/workflows/finalize-nightly-candidate.yml",
              ".github/workflows/generate-security-key-nightly.yml",
              ".github/workflows/run-nightly-secure-generator.yml",
              ".github/workflows/run-security-key-generator-v2.yml",
              ".github/workflows/run-security-key-generator-v3.yml",
              ".github/workflows/run-security-key-generator-v4.yml",
              ".nightly-candidate-marker",
              ".trigger-security-key",
              ".trigger-security-key-v2",
              ".trigger-security-key-v3",
              ".trigger-security-key-v4",
              "NIGHTLY_CANDIDATE.md",
          ]:
              Path(name).unlink(missing_ok=True)
          PY

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete verification gate
        run: |
          pnpm test
          pnpm build
          pnpm testWeb
          git diff --check

      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProtonnCord Nightly CI"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add hardware security-key identity continuity" \
            -m "Bind per-device and per-account Secure Messaging identities to a user-verified roaming WebAuthn credential, add portable public profiles and signed account proofs, retain outgoing render continuity, add encrypted-copy forwarding, clean temporary delivery workflows, and bump nightly to 1.15.1.5."
          git push --force-with-lease origin HEAD:refs/heads/feature/security-key-identity

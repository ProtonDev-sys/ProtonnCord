name: Harden integrated security-key vault candidate v2

on:
  pull_request:
    branches:
      - nightly
    paths:
      - .trigger-security-key-vault-hardening-v2

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/security-key-vault'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/security-key-vault
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Apply reviewed hardening with robust unwrap replacement
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin nightly
          git show origin/nightly:.github/workflows/harden-security-key-vault.yml > /tmp/hardening-v1.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/hardening-v1.yml').read_text()
          marker = '      - name: Apply key-lifetime and session-lock hardening\n        shell: bash\n        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit('v1 hardening block was not found exactly once')
          payload = source.split(marker, 1)[1].split('\n      - name:', 1)[0]
          lines = []
          for line in payload.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append('')
              else:
                  raise SystemExit(f'unexpected v1 hardening indentation: {line!r}')
          script = '\n'.join(lines) + '\n'

          label = "'vault plaintext cleanup on unwrap'"
          label_index = script.index(label)
          block_start = script.rfind('vault = replace_once(', 0, label_index)
          block_end = script.index('\n)\n', label_index) + len('\n)\n')
          robust = '''unwrap_start = vault.index('export function unwrapSecurityKeyVaultValue')
          unwrap_end = vault.index('\\n\\nfunction randomChallenge', unwrap_start)
          vault = vault[:unwrap_start] + ''' + repr('''export function unwrapSecurityKeyVaultValue(value: unknown): unknown {
              const envelope = parseSecurityKeyVaultEnvelope(value);
              if (!envelope) return value;
              if (!activeKey || activeProfile?.rootFingerprint !== envelope.rootFingerprint)
                  throw new SecurityKeyVaultError("locked");
              let plaintext: Buffer | null = null;
              try {
                  const decipher = createDecipheriv(
                      "aes-256-gcm",
                      activeKey,
                      decodeBase64Url(envelope.nonce, 12, 12),
                  );
                  decipher.setAAD(vaultAad(envelope.rootFingerprint));
                  decipher.setAuthTag(decodeBase64Url(envelope.tag, 16, 16));
                  plaintext = Buffer.concat([
                      decipher.update(decodeBase64Url(envelope.ciphertext, 1, MAX_ENCRYPTED_VAULT_BYTES)),
                      decipher.final(),
                  ]);
                  return JSON.parse(plaintext.toString("utf8"));
              } catch (error) {
                  if (error instanceof SecurityKeyVaultError) throw error;
                  throw new SecurityKeyVaultError("corrupt");
              } finally {
                  plaintext?.fill(0);
              }
          }''') + ''' + vault[unwrap_end:]
          '''
          script = script[:block_start] + robust + script[block_end:]
          Path('/tmp/apply-hardening-v2.sh').write_text(script)
          PY
          bash -n /tmp/apply-hardening-v2.sh
          bash /tmp/apply-hardening-v2.sh
          rm -f \
            .github/workflows/harden-security-key-vault-v2.yml \
            .trigger-security-key-vault-hardening-v2
          git add -A

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused security checks
        run: |
          pnpm lint:fix
          pnpm testSecureMessagingSecurityKey
          pnpm testSecureMessagingNative
          pnpm testTsc
          pnpm lint-styles

      - name: Run complete verification gate
        run: |
          pnpm test
          pnpm build
          pnpm testWeb
          git diff --check

      - name: Commit exact verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProtonnCord Nightly CI"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden security-key vault key lifetime" \
            -m "Wipe PRF-derived and plaintext buffers, wipe prepared keys on every exit path, lock the E2E vault when Discord accounts change or the plugin stops, clarify the existing-key action, and retain the complete verification gates."
          git push --force-with-lease origin HEAD:refs/heads/feature/security-key-vault

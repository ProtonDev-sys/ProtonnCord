name: Mobile nightly
on:
    push:
        branches: [nightly]
    pull_request:
        branches: [nightly]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: mobile-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.4
            - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
              with:
                  deno-version: v2.7.4
            - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with:
                  distribution: temurin
                  java-version: |
                      21
                      25
            - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
              with:
                  # Command-line tools are installed by the action; the legacy tools package is unavailable.
                  packages: platform-tools
            - run: sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0'
            - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
            - name: Build pinned Revenge API
              working-directory: mobile
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p .toolchain
                  revision=$(node -p "require('./toolchain.json').revengeNativeRevision")
                  git clone --filter=blob:none https://github.com/revenge-mod/revenge-xposed.git .toolchain/revenge-xposed
                  git -C .toolchain/revenge-xposed checkout --detach "$revision"
                  cd .toolchain/revenge-xposed
                  bash gradlew :api:publishToMavenLocal --console=plain
            - name: Test mobile against this desktop revision
              working-directory: mobile
              run: |
                  bun install --frozen-lockfile
                  bun audit
                  bun run test
                  bun run lint:types
                  bun run lint
            - name: Version and package mobile
              working-directory: mobile
              run: |
                  node tools/prepare-release.mjs '0.2.${{ github.run_number }}.${{ github.run_attempt }}-nightly'
                  bash gradlew :plugins:secure-messaging:testDebugUnitTest packageSecureMessaging --console=plain
                  bun run test:bundle
                  bun run generate-index --dist build/dist --base-url 'https://github.com/${{ github.repository }}/releases/download/mobile-build-${{ github.run_id }}-${{ github.run_attempt }}' --out build/dist/index.json
            - name: Build pinned Revenge runtime
              working-directory: mobile
              env:
                  REVENGE_DISCORD_SERVER_URL: https://discord.com/invite/ddcQf3s2Uq
                  REVENGE_DEFAULT_PLUGIN_REPOSITORY_URL: https://github.com/ProtonDev-sys/ProtonnCord/releases/download/mobile-nightly
              run: |
                  set -euo pipefail
                  revision=$(node -p "require('./toolchain.json').revengeRuntimeRevision")
                  git clone --filter=blob:none https://github.com/revenge-mod/revenge-bundle-next.git .toolchain/revenge-bundle-next
                  git -C .toolchain/revenge-bundle-next checkout --detach "$revision"
                  export REVENGE_SOURCE_REPOSITORY_URL="https://github.com/revenge-mod/revenge-bundle-next/tree/$revision"
                  export REVENGE_LICENSE_URL="https://raw.githubusercontent.com/revenge-mod/revenge-bundle-next/$revision/LICENSE"
                  cd .toolchain/revenge-bundle-next
                  deno install --frozen
                  node ../../tools/link-runtime-workspaces.mjs "$PWD"
                  deno run --unstable-bare-node-builtins --permission-set=build scripts/build.ts 2>&1 | tee ../runtime-build.log
                  if grep -Eq 'UNRESOLVED_IMPORT|MISSING_GLOBAL_NAME' ../runtime-build.log; then
                      echo 'Runtime dependencies were not bundled correctly.'
                      exit 1
                  fi
                  cp dist/revenge.bundle ../../build/dist/revenge.bundle
                  git archive --format=zip --output=../../build/dist/revenge-runtime-source.zip HEAD
                  cp LICENSE ../../build/dist/REVENGE-LICENSE
            - name: Record provenance and checksums
              working-directory: mobile
              run: |
                  cp toolchain.json build/dist/toolchain.json
                  printf '%s\n' '${{ github.sha }}' > build/dist/desktop-commit.txt
                  cd build/dist
                  sha256sum *.zip revenge.bundle > SHA256SUMS
                  python3 -B ../../tools/validate_release.py .
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: protonncord-mobile
                  path: mobile/build/dist/
                  if-no-files-found: error

    publish:
        if: github.repository == 'ProtonDev-sys/ProtonnCord' && github.ref == 'refs/heads/nightly' && github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 55
        permissions:
            contents: write
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Require full validation for this revision
              run: node scripts/requireReleaseValidation.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: protonncord-mobile
                  path: dist
            - name: Publish immutable build then update nightly index
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  tag=$(python3 -B mobile/tools/validate_release.py dist)
                  gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease --title "Mobile nightly $GITHUB_SHA" --notes "Android Secure Messaging built and tested against desktop revision $GITHUB_SHA."
                  runtime=$(node -p "require('./mobile/toolchain.json').runtimeRelease")
                  if ! gh release view "$runtime" >/dev/null 2>&1; then
                      gh release create "$runtime" dist/revenge.bundle dist/revenge-runtime-source.zip dist/REVENGE-LICENSE dist/toolchain.json --target "$GITHUB_SHA" --prerelease --title 'Pinned Revenge Next runtime for ProtonnCord Mobile' --notes 'Revenge runtime, corresponding upstream source, and license. Runtime updates are pinned separately from plugin updates.'
                  fi
                  git fetch --no-tags origin refs/heads/nightly
                  if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
                      echo 'A newer nightly commit exists; leaving its channel pointer intact.'
                      exit 0
                  fi
                  if ! gh release view mobile-nightly >/dev/null 2>&1; then
                      gh release create mobile-nightly --target "$GITHUB_SHA" --prerelease --title 'ProtonnCord Mobile nightly' --notes 'Add this release download root as a Revenge plugin repository. Each index points to immutable, checksummed build assets.'
                  fi
                  gh release upload mobile-nightly dist/index.json --clobber
                  gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/mobile-nightly" --field "sha=$GITHUB_SHA" --field force=true
                  [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/mobile-nightly" --jq '.object.type + " " + .object.sha')" == "commit $GITHUB_SHA" ]] || { echo 'The mobile-nightly tag did not advance to the published build.' >&2; exit 1; }

    installer:
        name: Deliver the signed Android APK
        needs: [build, publish]
        if: github.repository == 'ProtonDev-sys/ProtonnCord' && github.ref == 'refs/heads/nightly' && github.event_name != 'pull_request' && vars.ACT != 'true'
        uses: ./.github/workflows/android-installer.yml
        permissions:
            contents: write
            actions: read
        secrets:
            ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
            ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}

                  python - <<'PY'
                  import json
                  from pathlib import Path

                  def replace_once(text: str, old: str, new: str, label: str) -> str:
                      count = text.count(old)
                      if count != 1:
                          raise SystemExit(f"{label}: expected one match, found {count}")
                      return text.replace(old, new, 1)

                  native_path = Path("src/equicordplugins/secureMessaging.desktop/native.ts")
                  native = native_path.read_text()
                  native = replace_once(
                      native,
                      '        "security_key_cancelled" | "security_key_mismatch" | "storage_error";',
                      '        "security_key_cancelled" | "security_key_mismatch" | "security_key_storage_failed" | "storage_error";',
                      "native failure union",
                  )
                  native = replace_once(
                      native,
                      '        if (error.code === "credential_mismatch" || error.code === "invalid_profile")\n            return { status: "failed", error: "security_key_mismatch" };',
                      '        if (error.code === "credential_mismatch" || error.code === "invalid_profile")\n            return { status: "failed", error: "security_key_mismatch" };\n        if (error.code === "large_blob_failed")\n            return { status: "failed", error: "security_key_storage_failed" };',
                      "large-blob failure mapping",
                  )
                  native_path.write_text(native)

                  renderer_path = Path("src/equicordplugins/secureMessaging.desktop/index.tsx")
                  renderer = renderer_path.read_text()
                  renderer = replace_once(
                      renderer,
                      '        if (failure.reason === "security_key_unsupported") return "This security key does not support the WebAuthn PRF extension required for vault encryption.";',
                      '        if (failure.reason === "security_key_unsupported") return "This security key and WebAuthn provider support neither PRF nor large-blob storage for vault encryption.";',
                      "unsupported key message",
                  )
                  renderer = replace_once(
                      renderer,
                      '    if (failure.error === "security_key_mismatch") return "The wrong security key answered, or its profile no longer matches this vault.";',
                      '    if (failure.error === "security_key_mismatch") return "The wrong security key answered, or its profile no longer matches this vault.";\n    if (failure.error === "security_key_storage_failed") return "The security key could not store the encrypted vault seed. Check its resident-key and large-blob capacity, then retry.";',
                      "large-blob UI error",
                  )
                  renderer = replace_once(
                      renderer,
                      '                            <BaseText size="xs" color="text-muted">Optional. A PRF-capable FIDO2 key will be required to open the E2E key vault after setup.</BaseText>',
                      '                            <BaseText size="xs" color="text-muted">Supports FIDO2 security keys with PRF or large-blob storage.</BaseText>',
                      "setup compatibility text",
                  )
                  renderer = replace_once(
                      renderer,
                      '                            <code className="pc-secure-fingerprint">{keyState.profile.formattedRootFingerprint}</code>\n                            <div className="pc-secure-modal-actions">',
                      '                            <code className="pc-secure-fingerprint">{keyState.profile.formattedRootFingerprint}</code>\n                            <BaseText size="xs" color="text-muted">\n                                Mode: {keyState.profile.provider === "large_blob" ? "Large blob" : "PRF"}\n                            </BaseText>\n                            <div className="pc-secure-modal-actions">',
                      "provider display",
                  )
                  renderer_path.write_text(renderer)

                  package_path = Path("package.json")
                  package = json.loads(package_path.read_text())
                  if package["version"] != "1.15.1.7":
                      raise SystemExit(f"unexpected package version {package['version']}")
                  package["version"] = "1.15.1.8"
                  package_path.write_text(json.dumps(package, indent=4, ensure_ascii=False) + "\n")

                  marker_path = Path("src/components/settings/tabs/plugins/newPluginRelease.ts")
                  marker = replace_once(

name: Release
on:
    workflow_dispatch:
    push:
        branches:
            - main
            - staging
            - nightly

env:
    FORCE_COLOR: true

permissions:
    contents: write
    actions: read

concurrency:
    group: protonn-cord-release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    Build:
        name: Build Protonn Cord
        if: contains(fromJSON('["refs/heads/main", "refs/heads/staging", "refs/heads/nightly"]'), github.ref)
        # Release validation must remain independent of the single self-hosted Test runner.
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Use Node.js 24
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify repository privacy before publishing
              run: |
                  pnpm checkPrivacy
                  bash scripts/scanReleaseSecrets.sh git .

            - name: Verify update channel atomicity offline
              run: pnpm exec tsx --test scripts/testAuditReleaseAtomicityDeep.ts

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Package user downloads for the stable channel
              if: github.ref == 'refs/heads/main'
              run: |
                  pnpm packageRelease
                  pnpm testPublicRelease
                  bash scripts/scanReleaseSecrets.sh dir dist/public-release

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release
                  shopt -s nullglob

                  cp browser/browser.* release
                  cp ProtonnCord.user.{js,js.LEGAL.txt} release

                  release_files=(*.json *.zip *.asar)
                  if (( ${#release_files[@]} )); then
                      cp "${release_files[@]}" release
                  fi

                  cp desktop/* release
                  if [[ -d public-release ]]; then
                      cp public-release/* release
                  fi
                  for file in equibop/*; do
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done

                  find release -type f -size 0 -delete
                  rm -f release/package.json release/*.map

            - name: Require full validation for this revision
              if: github.repository == 'ProtonDev-sys/ProtonnCord' && vars.ACT != 'true'
              run: node scripts/requireReleaseValidation.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - name: Upload Protonn Cord update channel
              if: github.repository == 'ProtonDev-sys/ProtonnCord' && vars.ACT != 'true'
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  branch="$GITHUB_REF_NAME"
                  [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
                  timeout 60s git fetch --no-tags origin "refs/heads/$branch"
                  if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
                      echo "Skipping stale release build for $GITHUB_SHA; origin/$branch has advanced."
                      exit 0
                  fi

                  if [[ "$branch" == "main" ]]; then
                      tag="latest"
                  else
                      tag="$branch"
                  fi
                  echo "Preparing complete draft for $tag (--prerelease on nightly/staging)."
                  node scripts/releaseUpdateChannel.mjs

name: Finalize Secure Messaging audit

on:
    push:
        branches:
            - agent/audit-secure-messaging-performance

permissions:
    contents: write

concurrency:
    group: finalize-secure-messaging-audit-${{ github.ref }}
    cancel-in-progress: true

jobs:
    patch:
        name: Finalize Secure Messaging audit
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Apply final audit fixes
              run: |
                  python scripts/applySecureMessagingPerformanceTest.py
                  python scripts/fixSecureMessagingAuditTypecheck.py

            - name: Run performance boundaries
              run: pnpm testSecureMessagingPerformance

            - name: Type-check
              run: pnpm testTsc

            - name: Test Secure Messaging
              run: pnpm testSecureMessaging

            - name: Commit audited fixes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  if git diff --cached --quiet; then
                      exit 0
                  fi
                  git commit -m "perf(secure-messaging): finalize isolation audit"
                  git push origin "HEAD:${GITHUB_REF_NAME}"

name: Windows installer
on:
    workflow_dispatch:
    push:
        branches: [nightly]
    pull_request:
        branches: [nightly]

permissions:
    contents: read

jobs:
    Build:
        name: Build and exercise Windows setup
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build the standalone nightly payload
              run: pnpm buildStandalone
            - name: Package the pinned installer and current payload
              run: node scripts/buildWindowsInstaller.mjs
            - name: Exercise the actual setup window and pinned CLI
              run: node scripts/testWindowsInstaller.mjs
            - name: Upload Windows setup
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ProtonnCord-Windows-Setup
                  path: dist/windows/*
                  if-no-files-found: error
            - name: Upload setup screenshot
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ProtonnCord-Windows-Setup-Smoke
                  path: dist/windows-smoke.png
                  if-no-files-found: ignore

    Publish:
        name: Publish the Windows executable
        needs: Build
        if: github.repository == 'ProtonDev-sys/ProtonnCord' && github.ref == 'refs/heads/nightly' && github.event_name != 'pull_request' && vars.ACT != 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: write
            actions: read
        concurrency:
            group: protonn-cord-windows-release
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
            - name: Require full validation for this revision
              run: node scripts/requireReleaseValidation.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ProtonnCord-Windows-Setup
                  path: dist/windows
            - name: Publish only the verified executable
              run: node scripts/publishWindowsInstaller.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}

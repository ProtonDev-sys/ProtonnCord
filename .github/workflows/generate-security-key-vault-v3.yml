name: Generate integrated security-key vault candidate v3

on:
  pull_request:
    branches:
      - nightly
    paths:
      - .trigger-security-key-vault-v3

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/security-key-vault'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/security-key-vault
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Apply reviewed v2 integration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin nightly
          git show origin/nightly:.github/workflows/generate-security-key-vault-v2.yml > /tmp/security-key-vault-v2.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/security-key-vault-v2.yml').read_text()
          marker = '      - name: Apply reviewed integration with robust native-test stubs\n        shell: bash\n        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit('v2 integration block was not found exactly once')
          payload = source.split(marker, 1)[1].split('\n      - name:', 1)[0]
          lines = []
          for line in payload.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append('')
              else:
                  raise SystemExit(f'unexpected v2 integration indentation: {line!r}')
          Path('/tmp/apply-security-key-vault-v3.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash -n /tmp/apply-security-key-vault-v3.sh
          bash /tmp/apply-security-key-vault-v3.sh

      - name: Correct security-key unit-test filters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('scripts/testSecureMessagingSecurityKey.ts')
          source = test_path.read_text()
          old = 'filter: /^electron$/u'
          if source.count(old) != 2:
              raise SystemExit(f'esbuild Electron filter count was {source.count(old)}')
          test_path.write_text(source.replace(old, 'filter: /^electron$/'))

          for cleanup in [
              '.github/workflows/generate-security-key-vault-v3.yml',
              '.trigger-security-key-vault-v3',
          ]:
              Path(cleanup).unlink(missing_ok=True)
          PY

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused security-key checks
        run: |
          pnpm lint:fix
          pnpm testSecureMessagingSecurityKey
          pnpm testSecureMessagingNative
          pnpm testTsc
          pnpm lint-styles

      - name: Run complete verification gate
        run: |
          pnpm test
          pnpm build
          pnpm testWeb
          git diff --check

      - name: Commit exact verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProtonnCord Nightly CI"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use a security key to protect Secure Messaging E2E keys" \
            -m "Wrap the Secure Messaging vault with a WebAuthn PRF-derived AES-GCM key, require the physical key to unlock encryption and decryption, integrate setup and lock controls into the existing modal, remove the second chat-bar icon and old proof plugin, reduce modal text, and bump nightly to 1.15.1.6."
          git push --force-with-lease origin HEAD:refs/heads/feature/security-key-vault

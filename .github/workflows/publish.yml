name: Release Browser Extension
on:
    push:
        branches:
            - main

concurrency:
    group: browser-extension-release
    cancel-in-progress: false

env:
    FORCE_COLOR: true

permissions:
    contents: read

jobs:
    prepare:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
        outputs:
            release: ${{ steps.check.outputs.release }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Get package.json version
              id: pkg
              run: echo "version=v$(jq -r .version < package.json)" >> "$GITHUB_OUTPUT"

            - name: Get latest Git tag
              id: tag
              run: |
                  latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || echo "v0.0.0")
                  echo "latest=$latest_tag" >> "$GITHUB_OUTPUT"

            - name: Check if package.json version is newer
              id: check
              run: |
                  pkg="${{ steps.pkg.outputs.version }}"
                  latest="${{ steps.tag.outputs.latest }}"

                  echo "Latest tag: $latest"
                  echo "Package version: $pkg"

                  if [ "$pkg" != "$latest" ] && [ "$(sort -V <<<"$latest"$'\n'"$pkg" | tail -n1)" = "$pkg" ]; then
                    echo "release=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "release=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Stop if not newer
              if: steps.check.outputs.release == 'false'
              run: echo "No new version to release (package.json ${{ steps.pkg.outputs.version }} <= latest tag ${{ steps.tag.outputs.latest }})"

            - name: Create Tag
              if: steps.check.outputs.release == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
                    -f tag="${{ steps.pkg.outputs.version }}" \
                    -f message="Version ${{ steps.pkg.outputs.version }}" \
                    -f object="$GITHUB_SHA" \
                    -f type=commit \
                    --jq .sha)
                  gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                    -f ref="refs/tags/${{ steps.pkg.outputs.version }}" \
                    -f sha="$tag_sha"

            - name: Setup PNPM
              if: steps.check.outputs.release == 'true'
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Use Node.js 24
              if: steps.check.outputs.release == 'true'
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              if: steps.check.outputs.release == 'true'
              run: pnpm install --frozen-lockfile

            - name: Build web
              if: steps.check.outputs.release == 'true'
              run: pnpm buildWebStandalone

            - name: Create sources zip
              if: steps.check.outputs.release == 'true'
              run: zip -r dist/extension-sources.zip . -x "node_modules/*" -x "dist/*" -x ".git/*"

            - name: Store release archives
              if: steps.check.outputs.release == 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: browser-extension-release
                  path: |
                      dist/extension-chrome.zip
                      dist/extension-firefox.zip
                      dist/extension-sources.zip
                  if-no-files-found: error
                  retention-days: 1

    publish-chrome:
        needs: prepare
        if: needs.prepare.outputs.release == 'true' && vars.ACT == 'false'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: browser-extension-release-chrome
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PNPM
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Use Node.js 24
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install locked publisher
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Download release archives
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: browser-extension-release
                  path: dist

            - name: Publish Chrome extension
              run: pnpm --config.offline=true exec publish-extension --chrome-zip dist/extension-chrome.zip
              env:
                  CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
                  CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

    publish-firefox:
        needs: prepare
        if: needs.prepare.outputs.release == 'true' && vars.ACT == 'false'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: browser-extension-release-firefox
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PNPM
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Use Node.js 24
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install locked publisher
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Download release archives
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: browser-extension-release
                  path: dist

            - name: Publish Firefox extension
              run: pnpm --config.offline=true exec publish-extension --firefox-zip dist/extension-firefox.zip --firefox-sources-zip dist/extension-sources.zip
              env:
                  FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
                  FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                  FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

    publish-edge:
        needs: prepare
        if: needs.prepare.outputs.release == 'true' && vars.ACT == 'false'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: browser-extension-release-edge
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PNPM
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Use Node.js 24
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install locked publisher
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Download release archives
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: browser-extension-release
                  path: dist

            - name: Publish Edge extension
              run: pnpm --config.offline=true exec publish-extension --edge-zip dist/extension-chrome.zip
              env:
                  EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
                  EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
                  EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}

name: Finalize large-blob profile race hardening

on:
    push:
        branches:
            - feature/security-key-large-blob

permissions:
    contents: write

concurrency:
    group: finalize-large-blob-profile-race
    cancel-in-progress: false

jobs:
    finalize:
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: feature/security-key-large-blob
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Bind unlock completion to the complete provider profile
              shell: bash
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  from pathlib import Path

                  def replace_once(text: str, old: str, new: str, label: str) -> str:
                      count = text.count(old)
                      if count != 1:
                          raise SystemExit(f"{label}: expected one match, found {count}")
                      return text.replace(old, new, 1)

                  native_path = Path("src/equicordplugins/secureMessaging.desktop/native.ts")
                  native = native_path.read_text()
                  native = replace_once(
                      native,
                      '    securityKeyVaultProfileSummary,\n    type SecurityKeyVaultState,',
                      '    securityKeyVaultProfileSummary,\n    securityKeyVaultProfilesMatch,\n    type SecurityKeyVaultState,',
                      "profile matcher import",
                  )
                  native = replace_once(
                      native,
                      '            if (!currentEnvelope || currentEnvelope.rootFingerprint !== prepared.profile.rootFingerprint)\n',
                      '            if (!currentEnvelope || !securityKeyVaultProfilesMatch(currentEnvelope.profile, prepared.profile))\n',
                      "complete unlock race comparison",
                  )
                  native_path.write_text(native)

                  test_path = Path("scripts/testSecureMessagingSecurityKey.ts")
                  test = test_path.read_text()
                  anchor = '    assert.match(native, /wrapSecurityKeyVaultValue/u);\n'
                  addition = '''    assert.match(native, /securityKeyVaultProfilesMatch\\(currentEnvelope\\.profile, prepared\\.profile\\)/u,
        "unlock must reject any provider-profile change that occurs during the hardware ceremony");
'''
                  if addition not in test:
                      test = replace_once(test, anchor, anchor + addition, "native profile race assertion")
                  test_path.write_text(test)

                  Path(".github/workflows/finalize-large-blob-profile-race.yml").unlink(missing_ok=True)
                  PY

            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile

            - name: Run focused security checks
              run: |
                  pnpm lint:fix
                  pnpm testWebAuthnLargeBlob
                  pnpm testSecureMessagingSecurityKey
                  pnpm testSecureMessagingNative
                  pnpm testTsc
                  pnpm lint-styles

            - name: Run complete verification gate
              run: |
                  pnpm test
                  pnpm build
                  pnpm testWeb
                  git diff --check

            - name: Commit exact verified candidate
              shell: bash
              run: |
                  set -euo pipefail
                  git config user.name "ProtonnCord Nightly CI"
                  git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
                  git add -A
                  git diff --cached --check
                  git commit -m "Bind security-key unlock to the complete provider profile" \
                    -m "Reject any credential, provider, salt, public-key, timestamp, or transport change that occurs while the WebAuthn unlock ceremony is in progress, and retain the complete hardware-key and application verification gates."
                  git push origin HEAD:refs/heads/feature/security-key-large-blob

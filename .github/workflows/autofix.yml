name: autofix.ci

on:
    pull_request:

permissions:
    contents: read

jobs:
    autofix:
        name: autofix
        runs-on: ${{ contains(fromJSON('["push","schedule","workflow_dispatch","release"]'), github.event_name) && vars.CI_SERVER_LINUX == 'true' && fromJSON('["self-hosted","Linux","X64","desktop-3flaofg","ubuntu-24.04"]') || 'ubuntu-latest' }}
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run lint fix
              run: pnpm lint:fix

            - name: Run stylelint fix
              run: pnpm lint-styles:fix

            - uses: autofix-ci/action@v1

name: Harden hardware identity candidate v14

on:
  pull_request:
    branches:
      - nightly
    paths:
      - .trigger-security-key-v14

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/security-key-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/security-key-identity
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Apply reviewed hardening changes
        shell: bash
        run: |
          set -euo pipefail
          cat > src/equicordplugins/secureMessagingSecurityKey.desktop/rootLinks.ts <<'EOF'
          /*
           * Vencord, a Discord client mod
           * Copyright (c) 2026 Protonn Cord contributors
           * SPDX-License-Identifier: GPL-3.0-or-later
           */

          export interface SecurityKeyRootLinks {
              userIds: string[];
          }

          export function removePeerFromSecurityKeyRoot<T extends SecurityKeyRootLinks>(
              trustedRoots: Record<string, T>,
              rootFingerprint: string | null,
              peerUserId: string,
          ): void {
              if (!rootFingerprint) return;
              const root = trustedRoots[rootFingerprint];
              if (!root) return;
              root.userIds = root.userIds.filter(userId => userId !== peerUserId);
              if (root.userIds.length === 0) delete trustedRoots[rootFingerprint];
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          native_path = Path('src/equicordplugins/secureMessagingSecurityKey.desktop/native.ts')
          native = native_path.read_text()
          native = replace_once(
              native,
              'import {\n    securityKeyProofDigest,',
              'import { removePeerFromSecurityKeyRoot } from "./rootLinks";\nimport {\n    securityKeyProofDigest,',
              'root-link helper import',
          )
          native = replace_once(
              native,
              '''        if (previous && previous !== expectedRootFingerprint && !replaceExisting)
              return { status: "key_changed" };
          if (!account.trustedRoots[expectedRootFingerprint] &&
          ''',
              '''        if (previous && previous !== expectedRootFingerprint && !replaceExisting)
              return { status: "key_changed" };
          if (previous && previous !== expectedRootFingerprint)
              removePeerFromSecurityKeyRoot(account.trustedRoots, previous, peerUserId);
          if (!account.trustedRoots[expectedRootFingerprint] &&
          ''',
              'old-root replacement cleanup',
          )
          native = replace_once(
              native,
              '''        delete account.peerRoots[peerUserId];
          const root = account.trustedRoots[fingerprint];
          if (root) {
              root.userIds = root.userIds.filter(candidate => candidate !== peerUserId);
              if (root.userIds.length === 0) delete account.trustedRoots[fingerprint];
          }
          ''',
              '''        delete account.peerRoots[peerUserId];
          removePeerFromSecurityKeyRoot(account.trustedRoots, fingerprint, peerUserId);
          ''',
              'peer-forget root cleanup',
          )
          native_path.write_text(native)

          ui_path = Path('src/equicordplugins/secureMessagingSecurityKey.desktop/index.tsx')
          ui = ui_path.read_text()
          ui = replace_once(
              ui,
              'import { discordEditedTimestamp } from "../secureMessaging.desktop/messageMetadata";\n',
              'import { discordEditedTimestamp } from "../secureMessaging.desktop/messageMetadata";\nimport { getOptimisticOutgoingPlaintext } from "../secureMessaging.desktop/optimisticRendering";\n',
              'optimistic proof import',
          )
          ui = replace_once(
              ui,
              '''    const [plaintext, setPlaintext] = useState<string | null>(() =>
              !encrypted && isSecurityKeyProof(message.content) ? message.content : null);
          ''',
              '''    const [plaintext, setPlaintext] = useState<string | null>(() => {
              if (!encrypted) return isSecurityKeyProof(message.content) ? message.content : null;
              const optimistic = message.author?.id === localUserId
                  ? getOptimisticOutgoingPlaintext(message.content)
                  : undefined;
              return optimistic && isSecurityKeyProof(optimistic) ? optimistic : null;
          });
          ''',
              'optimistic proof initial render',
          )
          ui = replace_once(
              ui,
              '''        setPlaintext(null);
          if (!captureReady || !localUserId || !message.author?.id) return () => { active = false; };
          ''',
              '''        const optimistic = message.author?.id === localUserId
              ? getOptimisticOutgoingPlaintext(message.content)
              : undefined;
          setPlaintext(optimistic && isSecurityKeyProof(optimistic) ? optimistic : null);
          if (!captureReady || !localUserId || !message.author?.id) return () => { active = false; };
          ''',
              'optimistic proof effect render',
          )
          ui_path.write_text(ui)

          styles_path = Path('src/equicordplugins/secureMessagingSecurityKey.desktop/styles.css')
          styles = styles_path.read_text()
          insertion = '''
          [id^="chat-messages-"]:has(.pc-security-key-proof) [class*="messageContent"] {
              display: none;
          }

          '''
          anchor = '[id^="chat-messages-"]:has(.pc-security-key-proof) .pc-secure-message {'
          if insertion.strip() not in styles:
              if styles.count(anchor) != 1:
                  raise SystemExit(f'proof content-hiding anchor count was {styles.count(anchor)}')
              styles = styles.replace(anchor, insertion + anchor, 1)
          styles_path.write_text(styles)

          test_path = Path('scripts/testSecureMessagingSecurityKey.ts')
          test = test_path.read_text()
          test = replace_once(
              test,
              'import {\n    decodeBase64Url,',
              'import { removePeerFromSecurityKeyRoot } from "../src/equicordplugins/secureMessagingSecurityKey.desktop/rootLinks";\nimport {\n    decodeBase64Url,',
              'root-link test import',
          )
          test = replace_once(
              test,
              '''    const sameRootOnAnotherAccount = await securityKeyRootFingerprint(key.algorithm, key.publicKeySpki);
          ''',
              '''    const linkedRoots = {
              old: { userIds: [USER_ID, OTHER_USER_ID] },
              replacement: { userIds: [] as string[] },
          };
          removePeerFromSecurityKeyRoot(linkedRoots, "old", USER_ID);
          assert.deepEqual(linkedRoots.old.userIds, [OTHER_USER_ID],
              "replacing one account must remove it from the previous hardware root");
          removePeerFromSecurityKeyRoot(linkedRoots, "old", OTHER_USER_ID);
          assert.equal("old" in linkedRoots, false,
              "an unreferenced previous hardware root must be removed");

          const sameRootOnAnotherAccount = await securityKeyRootFingerprint(key.algorithm, key.publicKeySpki);
          ''',
              'root-link unit checks',
          )
          test = replace_once(
              test,
              '''    assert.match(rendererSource, /isSecurityKeyProof\(result\.plaintext\)/u);
          ''',
              '''    assert.match(rendererSource, /isSecurityKeyProof\(result\.plaintext\)/u);
          assert.match(rendererSource, /getOptimisticOutgoingPlaintext\(message\.content\)/u,
              "outgoing hardware proofs must render continuously through the optimistic message transition");

          const securityKeyStyles = readFileSync(new URL(
              "../src/equicordplugins/secureMessagingSecurityKey.desktop/styles.css",
              import.meta.url,
          ), "utf8");
          assert.match(securityKeyStyles, /:has\(\.pc-security-key-proof\) \[class\*="messageContent"\]/u,
              "raw proof payloads and encrypted envelopes must be hidden once the verified card is mounted");
          ''',
              'proof rendering static checks',
          )
          test_path.write_text(test)

          for cleanup in [
              '.github/workflows/run-security-key-generator-v14.yml',
              '.trigger-security-key-v14',
          ]:
              Path(cleanup).unlink(missing_ok=True)
          PY

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused diagnostics
        run: |
          pnpm testSecureMessagingSecurityKey
          pnpm testSecureMessagingOptimisticRendering
          pnpm testTsc
          pnpm exec eslint \
            src/equicordplugins/secureMessagingSecurityKey.desktop \
            scripts/testSecureMessagingSecurityKey.ts
          pnpm lint-styles

      - name: Run complete verification gate
        run: |
          pnpm test
          pnpm build
          pnpm testWeb
          git diff --check

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProtonnCord Nightly CI"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden hardware identity replacement and proof rendering" \
            -m "Remove accounts from retired roots on replacement, hide raw proof payloads, keep outgoing proof cards mounted through Discord's optimistic-to-canonical transition, and add regression coverage."
          git push --force-with-lease origin HEAD:refs/heads/feature/security-key-identity

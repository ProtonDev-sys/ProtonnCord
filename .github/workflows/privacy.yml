name: Repository privacy
on:
    pull_request:
    push:
        branches: [main, staging, nightly]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    scan:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - name: Check tracked files for private configuration and account exports
              run: node scripts/checkRepositoryPrivacy.mjs
            - name: Scan history and working tree for secrets
              run: |
                  curl --fail --location --silent --show-error --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
                  echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --strict
                  tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
                  /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts=--all
                  /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner

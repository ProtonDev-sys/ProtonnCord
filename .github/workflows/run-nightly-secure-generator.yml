name: Run nightly secure candidate generator

on:
  pull_request:
    branches:
      - nightly
    paths:
      - .trigger-secure-fixes

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Execute the reviewed generator embedded in nightly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-nightly-secure-fixes.yml').read_text()
          marker = '        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit(f'expected one generator run block, found {source.count(marker)}')
          payload = source.split(marker, 1)[1]
          output = []
          for line in payload.splitlines():
              if line.startswith('          '):
                  output.append(line[10:])
              elif not line.strip():
                  output.append('')
              else:
                  raise SystemExit(f'unexpected generator indentation: {line!r}')
          Path('/tmp/protonncord-nightly-generator.sh').write_text('\n'.join(output) + '\n')
          PY
          bash -n /tmp/protonncord-nightly-generator.sh
          bash /tmp/protonncord-nightly-generator.sh

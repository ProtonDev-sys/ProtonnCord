name: Run focused hardware identity candidate generator

on:
  pull_request:
    branches:
      - nightly
    paths:
      - .trigger-security-key-v5

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/security-key-identity'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/security-key-identity
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Apply focused reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin nightly fix/secure-forwarding
          git checkout origin/fix/secure-forwarding -- \
            src/equicordplugins/secureMessaging.desktop/forwarding.ts \
            src/equicordplugins/secureMessagingForwarding.desktop/index.ts

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def exact_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str, flags: int = 0) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one regex match, got {count}")
              return updated

          renderer_path = Path("src/equicordplugins/secureMessaging.desktop/index.tsx")
          renderer = renderer_path.read_text()
          if 'from "./optimisticRendering"' not in renderer:
              renderer = exact_once(
                  renderer,
                  'import { discordEditedTimestamp } from "./messageMetadata";',
                  'import { discordEditedTimestamp, discordMessageNonce } from "./messageMetadata";',
                  "message metadata import",
              )
              renderer = exact_once(
                  renderer,
                  'import type {\n    AnnouncementReviewResult,',
                  'import {\n    clearOptimisticOutgoingPlaintexts,\n    getOptimisticOutgoingPlaintext,\n    rememberOptimisticOutgoingPlaintext,\n    settleOptimisticOutgoingPlaintext,\n} from "./optimisticRendering";\nimport type {\n    AnnouncementReviewResult,',
                  "optimistic helper import",
              )
              renderer = exact_once(renderer, 'const optimisticOutgoingPlaintexts = new Map<string, string>();\n', '', "old optimistic map")
              renderer = regex_once(
                  renderer,
                  r'function rememberOptimisticOutgoingPlaintext\(ciphertext: string, plaintext: string\): void \{.*?\n\}\n\n',
                  '',
                  "old optimistic helper",
                  re.S,
              )
              if 'optimisticOutgoingPlaintexts.clear();' not in renderer:
                  raise SystemExit("old optimistic clear was not found")
              renderer = renderer.replace('optimisticOutgoingPlaintexts.clear();', 'clearOptimisticOutgoingPlaintexts();')
              renderer = exact_once(
                  renderer,
                  '? optimisticOutgoingPlaintexts.get(message.content)\n',
                  '? getOptimisticOutgoingPlaintext(message.content)\n',
                  "optimistic getter",
              )
              delete_line = '            optimisticOutgoingPlaintexts.delete(message.content);'
              if renderer.count(delete_line) != 2:
                  raise SystemExit(f"optimistic settlement lines: expected 2, got {renderer.count(delete_line)}")
              renderer = renderer.replace(
                  delete_line,
                  '            settleOptimisticOutgoingPlaintext(message.content, message.id, discordMessageNonce(message));',
              )

          if 'SECURITY_KEY_PROOF_PREFIX' not in renderer:
              renderer = exact_once(
                  renderer,
                  'import { settleGuardedRestFailure } from "./restGuardFailure";',
                  'import { SECURITY_KEY_PROOF_PREFIX } from "../secureMessagingSecurityKey.desktop/protocol";\nimport { settleGuardedRestFailure } from "./restGuardFailure";',
                  "security-key protocol import",
              )
          if 'visiblePlaintext?.startsWith(SECURITY_KEY_PROOF_PREFIX)' not in renderer:
              function_start = renderer.index('function EncryptedMessageAccessory')
              tail = renderer[function_start:]
              target = '    }, [captureProtection, key, localUserId]);\n\n    if (captureProtection !== "ready") {\n'
              if tail.count(target) != 1:
                  raise SystemExit(f"security-key renderer insertion point count was {tail.count(target)}")
              tail = tail.replace(
                  target,
                  '    }, [captureProtection, key, localUserId]);\n\n    if (visiblePlaintext?.startsWith(SECURITY_KEY_PROOF_PREFIX)) return null;\n\n    if (captureProtection !== "ready") {\n',
                  1,
              )
              renderer = renderer[:function_start] + tail
          renderer_path.write_text(renderer)

          embed_path = Path("src/equicordplugins/secureMessaging.desktop/embedUrls.ts")
          embed = embed_path.read_text()
          if 'inlineEmbedStatus === "present"' not in embed:
              embed = exact_once(
                  embed,
                  '    return inlineEmbedStatus !== "absent" && secureEmbedOnlyUrl(plaintext) !== null;',
                  '    // Keep the URL visible until a real local embed exists; otherwise the outgoing row goes blank while unfurling.\n    return inlineEmbedStatus === "present" && secureEmbedOnlyUrl(plaintext) !== null;',
                  "pending embed visibility",
              )
          embed_path.write_text(embed)

          security_ui_path = Path("src/equicordplugins/secureMessagingSecurityKey.desktop/index.tsx")
          security_ui = security_ui_path.read_text()
          if 'serializeSecurityKeyProof,' not in security_ui:
              security_ui = exact_once(
                  security_ui,
                  '    parseSecurityKeyProof,\n    type SecurityKeyProof,',
                  '    parseSecurityKeyProof,\n    serializeSecurityKeyProof,\n    type SecurityKeyProof,',
                  "security proof serializer import",
              )
          if 'SECURITY_KEY_PROOF_PREFIX + JSON.stringify' in security_ui:
              security_ui = regex_once(
                  security_ui,
                  r'SECURITY_KEY_PROOF_PREFIX \+ JSON\.stringify\(\[.*?\]\),\n            message\.id,',
                  'serializeSecurityKeyProof(proof),\n            message.id,',
                  "canonical proof review content",
                  re.S,
              )
          security_ui_path.write_text(security_ui)

          security_native_path = Path("src/equicordplugins/secureMessagingSecurityKey.desktop/native.ts")
          security_native = security_native_path.read_text().replace('            userIds: [discordAuthorId],', '            userIds: [],')
          security_native_path.write_text(security_native)

          security_test_path = Path("scripts/testSecureMessagingSecurityKey.ts")
          security_test = security_test_path.read_text()
          if 'type KeyObject,' not in security_test:
              security_test = exact_once(
                  security_test,
                  '    generateKeyPairSync,\n    sign,',
                  '    generateKeyPairSync,\n    type KeyObject,\n    sign,',
                  "test KeyObject import",
              )
              security_test = regex_once(
                  security_test,
                  r'privateKey: ReturnType<typeof generateKeyPairSync>\["privateKey"\];',
                  'privateKey: KeyObject;',
                  "test private-key type",
              )
          security_test_path.write_text(security_test)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          if package["version"] not in {"1.15.1.3", "1.15.1.4", "1.15.1.5"}:
              raise SystemExit(f"unexpected package version {package['version']}")
          package["version"] = "1.15.1.5"
          scripts = package["scripts"]
          scripts["testSecureMessagingOptimisticRendering"] = "tsx scripts/testSecureMessagingOptimisticRendering.ts"
          scripts["testSecureMessagingSecurityKey"] = "tsx scripts/testSecureMessagingSecurityKey.ts"
          combined = "pnpm testSecureMessagingOptimisticRendering && pnpm testSecureMessagingSecurityKey && pnpm testSecureMessagingRestGuard"
          if combined not in scripts["test"]:
              needle = "pnpm testMainProcessStdio && pnpm testSecureMessagingRestGuard"
              if scripts["test"].count(needle) != 1:
                  raise SystemExit("full test-chain insertion point is missing")
              scripts["test"] = scripts["test"].replace(needle, "pnpm testMainProcessStdio && " + combined, 1)
          package_path.write_text(json.dumps(package, indent=4, ensure_ascii=False) + "\n")

          marker_path = Path("src/components/settings/tabs/plugins/newPluginRelease.ts")
          marker = marker_path.read_text()
          marker, count = re.subn(r'version: "1\.15\.1\.[2345]"', 'version: "1.15.1.5"', marker, count=1)
          if count != 1:
              raise SystemExit("plugin release marker version was not updated")
          marker_path.write_text(marker)

          marker_test_path = Path("scripts/testPluginReleaseMarkers.ts")
          marker_test = marker_test_path.read_text()
          marker_test, count = re.subn(
              r'getReleaseNewPlugins\("1\.15\.1\.[456]", \["AutoJumpToMessage"\]\)',
              'getReleaseNewPlugins("1.15.1.6", ["AutoJumpToMessage"])',
              marker_test,
              count=1,
          )
          if count != 1:
              raise SystemExit("plugin marker no-phantom version was not updated")
          marker_test_path.write_text(marker_test)

          for name in [
              ".github/SECURE_NIGHTLY_NOTE",
              ".github/workflows/apply-nightly-secure-fixes.yml",
              ".github/workflows/cleanup-nightly-candidate.yml",
              ".github/workflows/finalize-nightly-candidate.yml",
              ".github/workflows/generate-security-key-nightly.yml",
              ".github/workflows/run-nightly-secure-generator.yml",
              ".github/workflows/run-security-key-generator-v2.yml",
              ".github/workflows/run-security-key-generator-v3.yml",
              ".github/workflows/run-security-key-generator-v4.yml",
              ".github/workflows/run-security-key-generator-v5.yml",
              ".nightly-candidate-marker",
              ".trigger-security-key",
              ".trigger-security-key-v2",
              ".trigger-security-key-v3",
              ".trigger-security-key-v4",
              ".trigger-security-key-v5",
              "NIGHTLY_CANDIDATE.md",
          ]:
              Path(name).unlink(missing_ok=True)
          PY

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused diagnostics
        run: |
          pnpm testSecureMessagingOptimisticRendering
          pnpm testSecureMessagingSecurityKey
          pnpm testTsc

      - name: Run complete verification gate
        run: |
          pnpm test
          pnpm build
          pnpm testWeb
          git diff --check

      - name: Commit verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProtonnCord Nightly CI"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add hardware security-key identity continuity" \
            -m "Bind per-device and per-account Secure Messaging identities to a user-verified roaming WebAuthn credential, add portable public profiles and signed account proofs, retain outgoing render continuity, add encrypted-copy forwarding, clean temporary delivery workflows, and bump nightly to 1.15.1.5."
          git push --force-with-lease origin HEAD:refs/heads/feature/security-key-identity

name: Generate integrated security-key vault candidate

on:
  pull_request:
    branches:
      - nightly
    paths:
      - .trigger-security-key-vault

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/security-key-vault'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/security-key-vault
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Integrate the security key into the E2E vault and modal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str, flags: int = 0) -> str:
              updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one regex match, got {count}")
              return updated

          native_path = Path('src/equicordplugins/secureMessaging.desktop/native.ts')
          native = native_path.read_text()

          native = replace_once(
              native,
              '} from "./protocol";\n',
              '''} from "./protocol";
          import {
              activatePreparedSecurityKeyVault,
              clearSecurityKeyVaultSession,
              parseSecurityKeyVaultEnvelope,
              prepareSecurityKeyVaultImport,
              prepareSecurityKeyVaultSetup,
              prepareSecurityKeyVaultUnlock,
              type PreparedSecurityKeyVault,
              SecurityKeyVaultError,
              type SecurityKeyVaultProfileSummary,
              securityKeyVaultProfileSummary,
              type SecurityKeyVaultState,
              securityKeyVaultStateForValue,
              unwrapSecurityKeyVaultValue,
              wrapSecurityKeyVaultValue,
          } from "./securityKeyVault";
          ''',
              'security-key vault imports',
          )
          native = replace_once(
              native,
              'export type VaultUnavailableReason = "encryption_unavailable" | "unsafe_linux_backend" | "vault_unreadable";',
              'export type VaultUnavailableReason = "encryption_unavailable" | "security_key_locked" | "security_key_unsupported" | "unsafe_linux_backend" | "vault_unreadable";',
              'vault unavailable reasons',
          )
          native = replace_once(
              native,
              '        "cryptographic_operation_failed" | "message_too_long" | "screen_capture_protection_failed" | "storage_error";',
              '        "cryptographic_operation_failed" | "message_too_long" | "screen_capture_protection_failed" |\n        "security_key_cancelled" | "security_key_mismatch" | "storage_error";',
              'native failure errors',
          )
          native = replace_once(
              native,
              'export type IdentityResult = { status: "ready"; identity: IdentitySummary; } | NativeFailure;\n',
              'export type IdentityResult = { status: "ready"; identity: IdentitySummary; } | NativeFailure;\nexport type SecurityKeyVaultResult = SecurityKeyVaultState | NativeFailure;\n',
              'security-key state type',
          )
          native = regex_once(
              native,
              r'function mapOperationFailure\(error: unknown\): NativeFailure \{.*?\n\}',
              '''function mapOperationFailure(error: unknown): NativeFailure {
              if (error instanceof SecurityKeyVaultError) {
                  if (error.code === "locked") return unavailableFailure("security_key_locked");
                  if (error.code === "unsupported") return unavailableFailure("security_key_unsupported");
                  if (error.code === "cancelled") return { status: "failed", error: "security_key_cancelled" };
                  if (error.code === "credential_mismatch" || error.code === "invalid_profile")
                      return { status: "failed", error: "security_key_mismatch" };
                  if (error.code === "corrupt") return unavailableFailure("vault_unreadable");
              }
              if (error instanceof VaultOperationError) {
                  if (error.code === "encryption_unavailable" || error.code === "unsafe_linux_backend" || error.code === "vault_unreadable")
                      return unavailableFailure(error.code);
                  if (error.code === "capacity_exceeded") return { status: "failed", error: "capacity_exceeded" };
                  if (error.code === "cryptographic_operation_failed") return cryptoFailure();
              }
              return { status: "failed", error: "storage_error" };
          }''',
              'security-key failure mapping',
              re.S,
          )

          cache_anchor = '''function scheduleAuthenticatedAttachmentCacheCleanup(): void {
          '''
          clear_cache = '''function clearAuthenticatedAttachmentCache(): void {
              if (authenticatedAttachmentCacheCleanupTimer !== null) clearTimeout(authenticatedAttachmentCacheCleanupTimer);
              authenticatedAttachmentCacheCleanupTimer = null;
              for (const [key, entry] of authenticatedAttachmentCache)
                  removeAuthenticatedAttachmentCacheEntry(key, entry);
              authenticatedAttachmentCacheBytes = 0;
          }

          '''
          if 'function clearAuthenticatedAttachmentCache()' not in native:
              native = replace_once(native, cache_anchor, clear_cache + cache_anchor, 'native plaintext cache clear')

          vault_block = '''async function readVaultStoredValue(): Promise<unknown | null> {
              await ensureVaultDirectory();
              try {
                  const vaultStat = await stat(VAULT_PATH);
                  if (!vaultStat.isFile() || vaultStat.size === 0 || vaultStat.size > MAX_VAULT_BYTES)
                      throw new VaultOperationError("vault_unreadable");
              } catch (error) {
                  if (hasErrorCode(error, "ENOENT")) return null;
                  throw error;
              }
              await confirmEncryptedFileDurability(VAULT_PATH);
              try {
                  const ciphertext = await readFile(VAULT_PATH);
                  if (ciphertext.byteLength === 0 || ciphertext.byteLength > MAX_VAULT_BYTES)
                      throw new VaultOperationError("vault_unreadable");
                  const plaintext = safeStorage.decryptString(ciphertext);
                  if (Buffer.byteLength(plaintext, "utf8") > MAX_VAULT_BYTES)
                      throw new VaultOperationError("vault_unreadable");
                  return JSON.parse(plaintext);
              } catch (error) {
                  if (error instanceof VaultOperationError) throw error;
                  throw new VaultOperationError("vault_unreadable");
              }
          }

          async function loadVault(): Promise<VaultFile> {
              if (cachedVault) return structuredClone(cachedVault);
              const stored = await readVaultStoredValue();
              if (stored === null) {
                  cachedVault = { accounts: {}, version: VAULT_VERSION };
                  cachedVaultSignature = "missing";
                  return structuredClone(cachedVault);
              }

              try {
                  const parsed = unwrapSecurityKeyVaultValue(stored);
                  const vault = parseVault(parsed);
                  if (!vault) throw new VaultOperationError("vault_unreadable");
                  for (const [accountUserId, account] of Object.entries(vault.accounts)) {
                      await validateIdentityKeyPairs(account.identity);
                      for (const [fingerprint, historical] of Object.entries(account.identityHistory)) {
                          await validateIdentityKeyPairs(historical.identity);
                          if ((await publicIdentity(historical.identity, accountUserId)).fingerprint !== fingerprint)
                              throw new VaultOperationError("vault_unreadable");
                      }
                      for (const peer of Object.values(account.trustedPeers)) {
                          const computed = await fingerprintPublicKeys(
                              peer.identity.userId,
                              peer.identity.signingPublicKey,
                              peer.identity.hpkePublicKey,
                          );
                          if (computed !== peer.identity.fingerprint) throw new VaultOperationError("vault_unreadable");
                      }
                      for (const history of Object.values(account.peerIdentityHistory)) {
                          for (const [fingerprint, historical] of Object.entries(history)) {
                              const computed = await fingerprintPublicKeys(
                                  historical.identity.userId,
                                  historical.identity.signingPublicKey,
                                  historical.identity.hpkePublicKey,
                              );
                              if (computed !== fingerprint) throw new VaultOperationError("vault_unreadable");
                          }
                      }
                  }
                  cachedVault = structuredClone(vault);
                  cachedVaultSignature = await getVaultSignature();
                  return structuredClone(vault);
              } catch (error) {
                  if (error instanceof VaultOperationError || error instanceof SecurityKeyVaultError) throw error;
                  throw new VaultOperationError("vault_unreadable");
              }
          }

          async function saveVault(vault: VaultFile, forcePlain = false): Promise<void> {
              let ciphertext: Buffer;
              try {
                  const stored = forcePlain ? vault : wrapSecurityKeyVaultValue(vault);
                  ciphertext = safeStorage.encryptString(JSON.stringify(stored));
              } catch (error) {
                  if (error instanceof SecurityKeyVaultError) throw error;
                  throw new VaultOperationError("storage_error");
              }
              if (ciphertext.byteLength === 0 || ciphertext.byteLength > MAX_VAULT_BYTES)
                  throw new VaultOperationError("capacity_exceeded");

              await ensureVaultDirectory();
              const temporaryPath = join(VAULT_DIR, `vault.${randomUUID()}.tmp`);
              try {
                  await writeFile(temporaryPath, ciphertext, { flag: "wx", flush: true, mode: 0o600 });
                  await rename(temporaryPath, VAULT_PATH);
                  if (process.platform === "win32") await syncEncryptedFile(VAULT_PATH);
                  await syncVaultDirectoryEntry();
                  await chmod(VAULT_PATH, 0o600).catch(() => undefined);
                  cachedVaultSignature = await getVaultSignature();
              } catch (error) {
                  if (error instanceof VaultOperationError) throw error;
                  throw new VaultOperationError("storage_error");
              } finally {
                  await rm(temporaryPath, { force: true }).catch(() => undefined);
              }
              cachedVault = structuredClone(vault);
          }'''
          native = regex_once(
              native,
              r'async function loadVault\(\): Promise<VaultFile> \{.*?\n\}\n\nasync function saveVault\(vault: VaultFile\): Promise<void> \{.*?\n\}',
              vault_block,
              'hardware-protected vault storage',
              re.S,
          )

          security_functions = '''async function configureSecurityKeyVault(
              prepared: PreparedSecurityKeyVault,
          ): Promise<SecurityKeyVaultResult> {
              return runSerialized(async (): Promise<SecurityKeyVaultResult> => {
                  const stored = await readVaultStoredValue();
                  if (parseSecurityKeyVaultEnvelope(stored))
                      return invalidInput("A security key already protects this Secure Messaging vault");
                  const vault = await loadVault();
                  activatePreparedSecurityKeyVault(prepared);
                  cachedVault = null;
                  try {
                      await saveVault(vault);
                      clearAuthenticatedAttachmentCache();
                      return {
                          status: "unlocked",
                          profile: securityKeyVaultProfileSummary(prepared.profile),
                      };
                  } catch (error) {
                      clearSecurityKeyVaultSession();
                      cachedVault = null;
                      throw error;
                  }
              });
          }

          export async function getSecurityKeyVaultState(
              event: IpcMainInvokeEvent,
          ): Promise<SecurityKeyVaultResult> {
              const callerFailure = validateIpcCaller(event);
              if (callerFailure) return callerFailure;
              return runSerialized(async (): Promise<SecurityKeyVaultResult> =>
                  securityKeyVaultStateForValue(await readVaultStoredValue()));
          }

          export async function setupSecurityKeyVault(
              event: IpcMainInvokeEvent,
              localUserId: string,
          ): Promise<SecurityKeyVaultResult> {
              const callerFailure = validateIpcCaller(event);
              if (callerFailure) return callerFailure;
              const user = validateLocalUserId(localUserId);
              if (!user.ok) return invalidInput(user.error);
              try {
                  return configureSecurityKeyVault(await prepareSecurityKeyVaultSetup(event, user.value));
              } catch (error) {
                  return mapOperationFailure(error);
              }
          }

          export async function importSecurityKeyVault(
              event: IpcMainInvokeEvent,
              localUserId: string,
              exportedProfile: string,
          ): Promise<SecurityKeyVaultResult> {
              const callerFailure = validateIpcCaller(event);
              if (callerFailure) return callerFailure;
              const user = validateLocalUserId(localUserId);
              if (!user.ok) return invalidInput(user.error);
              if (typeof exportedProfile !== "string") return invalidInput("exportedProfile must be a security-key profile");
              try {
                  return configureSecurityKeyVault(await prepareSecurityKeyVaultImport(event, exportedProfile));
              } catch (error) {
                  return mapOperationFailure(error);
              }
          }

          export async function unlockSecurityKeyVault(
              event: IpcMainInvokeEvent,
          ): Promise<SecurityKeyVaultResult> {
              const callerFailure = validateIpcCaller(event);
              if (callerFailure) return callerFailure;
              let initialEnvelope;
              try {
                  validateStorageAvailability();
                  initialEnvelope = parseSecurityKeyVaultEnvelope(await readVaultStoredValue());
              } catch (error) {
                  return mapOperationFailure(error);
              }
              if (!initialEnvelope) return invalidInput("This Secure Messaging vault is not protected by a security key");

              let prepared: PreparedSecurityKeyVault;
              try {
                  prepared = await prepareSecurityKeyVaultUnlock(event, initialEnvelope.profile);
              } catch (error) {
                  return mapOperationFailure(error);
              }
              return runSerialized(async (): Promise<SecurityKeyVaultResult> => {
                  const currentEnvelope = parseSecurityKeyVaultEnvelope(await readVaultStoredValue());
                  if (!currentEnvelope || currentEnvelope.rootFingerprint !== prepared.profile.rootFingerprint)
                      return { status: "failed", error: "security_key_mismatch" };
                  activatePreparedSecurityKeyVault(prepared);
                  cachedVault = null;
                  try {
                      await loadVault();
                      clearAuthenticatedAttachmentCache();
                      return {
                          status: "unlocked",
                          profile: securityKeyVaultProfileSummary(prepared.profile),
                      };
                  } catch (error) {
                      clearSecurityKeyVaultSession();
                      cachedVault = null;
                      throw error;
                  }
              });
          }

          export async function lockSecurityKeyVault(
              event: IpcMainInvokeEvent,
          ): Promise<SecurityKeyVaultResult> {
              const callerFailure = validateIpcCaller(event);
              if (callerFailure) return callerFailure;
              return runSerialized(async (): Promise<SecurityKeyVaultResult> => {
                  const stored = await readVaultStoredValue();
                  const envelope = parseSecurityKeyVaultEnvelope(stored);
                  clearSecurityKeyVaultSession();
                  cachedVault = null;
                  clearAuthenticatedAttachmentCache();
                  return envelope
                      ? { status: "locked", profile: securityKeyVaultProfileSummary(envelope.profile) }
                      : { status: "not_configured" };
              });
          }

          export async function removeSecurityKeyVault(
              event: IpcMainInvokeEvent,
          ): Promise<SecurityKeyVaultResult> {
              const callerFailure = validateIpcCaller(event);
              if (callerFailure) return callerFailure;
              return runSerialized(async (): Promise<SecurityKeyVaultResult> => {
                  const stored = await readVaultStoredValue();
                  if (!parseSecurityKeyVaultEnvelope(stored)) return { status: "not_configured" };
                  const vault = await loadVault();
                  await saveVault(vault, true);
                  clearSecurityKeyVaultSession();
                  cachedVault = null;
                  clearAuthenticatedAttachmentCache();
                  return { status: "not_configured" };
              });
          }

          '''
          native = replace_once(
              native,
              'export async function getIdentity(event: IpcMainInvokeEvent, localUserId: string): Promise<IdentityResult> {\n',
              security_functions + 'export async function getIdentity(event: IpcMainInvokeEvent, localUserId: string): Promise<IdentityResult> {\n',
              'security-key IPC methods',
          )
          native_path.write_text(native)

          renderer_path = Path('src/equicordplugins/secureMessaging.desktop/index.tsx')
          renderer = renderer_path.read_text()
          renderer = replace_once(
              renderer,
              '    StickersStore,\n    Toasts,',
              '    StickersStore,\n    TextArea,\n    Toasts,',
              'TextArea import',
          )
          renderer = renderer.replace('import { SECURITY_KEY_PROOF_PREFIX } from "../secureMessagingSecurityKey.desktop/protocol";\n', '')
          renderer = replace_once(
              renderer,
              '    NativeFailure,\n} from "./native";',
              '    NativeFailure,\n    SecurityKeyVaultResult,\n} from "./native";',
              'security-key renderer type',
          )
          renderer = replace_once(
              renderer,
              '        if (failure.reason === "vault_unreadable") return "The encrypted Secure Messaging vault could not be read. It was not reset.";\n',
              '        if (failure.reason === "vault_unreadable") return "The encrypted Secure Messaging vault could not be read. It was not reset.";\n        if (failure.reason === "security_key_locked") return "Unlock the security key in Secure Messaging to read or send encrypted messages.";\n        if (failure.reason === "security_key_unsupported") return "This security key does not support the WebAuthn PRF extension required for vault encryption.";\n',
              'security-key unavailable messages',
          )
          renderer = replace_once(
              renderer,
              '    if (failure.error === "screen_capture_protection_failed") return "Encrypted content visibility could not be updated safely.";\n',
              '    if (failure.error === "screen_capture_protection_failed") return "Encrypted content visibility could not be updated safely.";\n    if (failure.error === "security_key_cancelled") return "The security-key operation was cancelled or timed out.";\n    if (failure.error === "security_key_mismatch") return "The wrong security key answered, or its profile no longer matches this vault.";\n',
              'security-key failure messages',
          )
          renderer = renderer.replace('    if (visiblePlaintext?.startsWith(SECURITY_KEY_PROOF_PREFIX)) return null;\n\n', '')

          manager = '''function ConversationManager({ channel, modalProps }: ConversationManagerProps) {
              const context = currentSnapshot(channel);
              const [identity, setIdentity] = useState<IdentityResult | null>(null);
              const [conversation, setConversation] = useState<ConversationResult | null>(null);
              const [securityKey, setSecurityKey] = useState<SecurityKeyVaultResult | null>(null);
              const [selectedRecipientIds, setSelectedRecipientIds] = useState<string[]>([]);
              const [enableEncryption, setEnableEncryption] = useState(false);
              const [busy, setBusy] = useState(false);
              const [error, setError] = useState<string | null>(null);
              const [confirmRotation, setConfirmRotation] = useState(false);
              const [confirmRemoveKey, setConfirmRemoveKey] = useState(false);
              const [showImport, setShowImport] = useState(false);
              const [importProfile, setImportProfile] = useState("");
              const captureProtection = useScreenCaptureProtectionStatus();

              const load = useCallback(async () => {
                  if (!context) return;
                  setBusy(true);
                  setError(null);
                  try {
                      const nextSecurityKey = await Native.getSecurityKeyVaultState();
                      setSecurityKey(nextSecurityKey);
                      if (isNativeFailure(nextSecurityKey)) {
                          setIdentity(null);
                          setConversation(null);
                          setError(failureMessage(nextSecurityKey));
                          return;
                      }
                      if (nextSecurityKey.status === "locked") {
                          setIdentity(null);
                          setConversation(null);
                          return;
                      }

                      const [nextIdentity, nextConversation] = await Promise.all([
                          Native.getIdentity(context.localUserId),
                          Native.getConversation(context.localUserId, context.snapshot),
                      ]);
                      setIdentity(nextIdentity);
                      setConversation(nextConversation);
                      updateMessageLengthBypass(context, nextConversation);
                      if (conversationHasDetails(nextConversation)) {
                          setSelectedRecipientIds(availableSelectedRecipientIds(nextConversation));
                          setEnableEncryption(nextConversation.status === "enabled");
                      }
                  } catch {
                      setError("Secure Messaging could not load its state.");
                  } finally {
                      setBusy(false);
                  }
              }, [channel.id, channel.recipients?.join(","), context?.localUserId]);

              useEffect(() => { void load(); }, [load]);

              if (!context) {
                  return <Modal {...modalProps} size="sm" title="Secure Messaging"><div className="pc-secure-modal">Only DMs and group DMs are supported.</div></Modal>;
              }

              const details = conversation && conversationHasDetails(conversation) ? conversation : null;
              const readyIdentity = identity?.status === "ready" ? identity.identity : null;
              const keyFailure = securityKey && isNativeFailure(securityKey) ? securityKey : null;
              const keyState = securityKey && !keyFailure ? securityKey : null;
              const vaultLocked = keyState?.status === "locked";

              const runKeyAction = async (operation: () => Promise<SecurityKeyVaultResult>) => {
                  setBusy(true);
                  setError(null);
                  try {
                      const result = await operation();
                      setSecurityKey(result);
                      if (isNativeFailure(result)) setError(failureMessage(result));
                      else {
                          revokePreparedSecureOperations();
                          invalidateSecureRenderCaches();
                          await load();
                      }
                  } catch {
                      setError("The security-key operation failed.");
                  } finally {
                      setBusy(false);
                  }
              };

              const toggleRecipient = (userId: string, checked: boolean) => {
                  setSelectedRecipientIds(current => checked
                      ? [...new Set([...current, userId])].sort((left, right) => left.localeCompare(right))
                      : current.filter(id => id !== userId));
              };

              const save = async () => {
                  if (enableEncryption && selectedRecipientIds.length === 0) {
                      setError("Select at least one verified recipient before enabling encryption.");
                      return;
                  }
                  setBusy(true);
                  setError(null);
                  try {
                      const result = await Native.configureConversation(context.localUserId, {
                          enabled: enableEncryption,
                          selectedRecipientIds,
                          snapshot: context.snapshot,
                      });
                      revokePreparedSecureOperations();
                      setConversation(result);
                      updateMessageLengthBypass(context, result);
                      if (result.status === "enabled" || result.status === "disabled") {
                          showToast(result.status === "enabled" ? "Encrypted sending enabled." : "Encrypted sending disabled.", Toasts.Type.SUCCESS);
                          modalProps.onClose();
                      } else if (isNativeFailure(result)) setError(failureMessage(result));
                      else setError(conversationStatusMessage(result));
                  } catch {
                      setError("Secure Messaging refused to save this configuration.");
                  } finally {
                      setBusy(false);
                  }
              };

              const rotate = async () => {
                  if (!readyIdentity || !confirmRotation) return;
                  setBusy(true);
                  setError(null);
                  try {
                      const result = await Native.rotateIdentity(context.localUserId, readyIdentity.fingerprint);
                      if (result.status === "rotated") {
                          revokePreparedSecureOperations();
                          invalidateSecureRenderCaches();
                          setConfirmRotation(false);
                          showToast(`Identity rotated; ${result.disabledConversationCount} protected conversation(s) disabled.`, Toasts.Type.SUCCESS);
                          await load();
                      } else if (result.status === "fingerprint_mismatch") {
                          setIdentity({ status: "ready", identity: result.identity });
                          setError("The identity changed before rotation.");
                      } else setError(failureMessage(result));
                  } catch {
                      setError("Identity rotation failed safely.");
                  } finally {
                      setBusy(false);
                  }
              };

              return (
                  <Modal
                      {...modalProps}
                      size="medium"
                      title="Secure Messaging"
                      actions={[
                          { text: "Save", variant: "primary", onClick: () => void save(), disabled: busy || !details || vaultLocked },
                          { text: "Cancel", variant: "secondary", onClick: modalProps.onClose, disabled: busy },
                      ]}
                  >
                      <div className="pc-secure-modal">
                          <section className="pc-secure-modal-section">
                              <Heading tag="h5">Security key</Heading>
                              {securityKey == null && <BaseText size="sm">Loading…</BaseText>}
                              {keyFailure && <BaseText size="sm" className="pc-secure-status-danger">{failureMessage(keyFailure)}</BaseText>}
                              {keyState?.status === "not_configured" && (
                                  <>
                                      <BaseText size="xs" color="text-muted">Optional. A PRF-capable FIDO2 key will be required to open the E2E key vault after setup.</BaseText>
                                      <div className="pc-secure-modal-actions">
                                          <Button size="small" variant="primary" disabled={busy} onClick={() => void runKeyAction(() => Native.setupSecurityKeyVault(context.localUserId))}>
                                              Set up security key
                                          </Button>
                                          <Button size="small" disabled={busy} onClick={() => setShowImport(value => !value)}>
                                              Use existing key
                                          </Button>
                                      </div>
                                      {showImport && (
                                          <>
                                              <TextArea autosize value={importProfile} onChange={setImportProfile} placeholder="PCSKV1:…" disabled={busy} />
                                              <Button size="small" disabled={busy || !importProfile.trim()} onClick={() => void runKeyAction(() => Native.importSecurityKeyVault(context.localUserId, importProfile))}>
                                                  Verify and import
                                              </Button>
                                          </>
                                      )}
                                  </>
                              )}
                              {(keyState?.status === "locked" || keyState?.status === "unlocked") && (
                                  <>
                                      <code className="pc-secure-fingerprint">{keyState.profile.formattedRootFingerprint}</code>
                                      <div className="pc-secure-modal-actions">
                                          {keyState.status === "locked" ? (
                                              <Button size="small" variant="primary" disabled={busy} onClick={() => void runKeyAction(() => Native.unlockSecurityKeyVault())}>
                                                  Unlock
                                              </Button>
                                          ) : (
                                              <>
                                                  <Button size="small" disabled={busy} onClick={() => {
                                                      copyToClipboard(keyState.profile.exportText);
                                                      showToast("Security-key profile copied.", Toasts.Type.SUCCESS);
                                                  }}>
                                                      Copy profile
                                                  </Button>
                                                  <Button size="small" disabled={busy} onClick={() => void runKeyAction(() => Native.lockSecurityKeyVault())}>
                                                      Lock
                                                  </Button>
                                              </>
                                          )}
                                      </div>
                                      {keyState.status === "unlocked" && (
                                          <>
                                              <Checkbox value={confirmRemoveKey} disabled={busy} onChange={(_event, checked) => setConfirmRemoveKey(checked)} size={20}>
                                                  <BaseText size="xs">Remove security-key protection from this vault.</BaseText>
                                              </Checkbox>
                                              <Button size="small" variant="dangerPrimary" disabled={!confirmRemoveKey || busy} onClick={() => void runKeyAction(() => Native.removeSecurityKeyVault())}>
                                                  Remove protection
                                              </Button>
                                          </>
                                      )}
                                  </>
                              )}
                          </section>

                          {!vaultLocked && (
                              <>
                                  <section className="pc-secure-modal-section">
                                      <Heading tag="h5">Identity</Heading>
                                      {identity == null && <BaseText size="sm">Loading…</BaseText>}
                                      {identity && isNativeFailure(identity) && <BaseText size="sm" className="pc-secure-status-danger">{failureMessage(identity)}</BaseText>}
                                      {readyIdentity && (
                                          <>
                                              <IdentityBlock identity={readyIdentity} />
                                              <Button size="small" onClick={() => void sendKeyAnnouncement(channel.id, context.localUserId)} disabled={busy}>
                                                  Share public key
                                              </Button>
                                          </>
                                      )}
                                  </section>

                                  <section className="pc-secure-modal-section">
                                      <Heading tag="h5">Recipients</Heading>
                                      {details?.participants.map(participant => {
                                          const userId = participant.status === "untrusted" ? participant.userId : participant.identity.userId;
                                          const trusted = participant.status === "trusted";
                                          return (
                                              <div className="pc-secure-participant" key={userId}>
                                                  <Checkbox
                                                      value={trusted && selectedRecipientIds.includes(userId)}
                                                      disabled={!trusted || busy}
                                                      onChange={(_event, checked) => toggleRecipient(userId, checked)}
                                                      size={20}
                                                  >
                                                      <div className="pc-secure-participant-identity">
                                                          <BaseText size="sm" weight="semibold">{userLabel(userId)}</BaseText>
                                                          <Span size="xs" color="text-muted">
                                                              {trusted ? participant.identity.formattedFingerprint :
                                                                  participant.status === "key_changed" ? "Key changed" : "Not verified"}
                                                          </Span>
                                                      </div>
                                                  </Checkbox>
                                              </div>
                                          );
                                      })}
                                      {!details && !busy && <BaseText size="sm">Conversation state is unavailable.</BaseText>}
                                  </section>

                                  <section className="pc-secure-modal-section">
                                      <Checkbox value={enableEncryption} disabled={busy || !details} onChange={(_event, checked) => setEnableEncryption(checked)} size={20}>
                                          <BaseText size="sm" weight="semibold">Enable encryption</BaseText>
                                      </Checkbox>
                                      {conversation && <BaseText size="xs">{conversationStatusMessage(conversation)}</BaseText>}
                                  </section>

                                  <section className="pc-secure-modal-section">
                                      <Heading tag="h5">Visibility</Heading>
                                      <Button
                                          size="small"
                                          variant={captureProtection === "screenshot" ? "primary" : "secondary"}
                                          disabled={captureProtection === "pending" || captureProtection === "disabled"}
                                          onClick={() => void setScreenshotMode(captureProtection === "ready")}
                                      >
                                          {captureProtection === "screenshot" ? "Show encrypted content" :
                                              captureProtection === "failed" ? "Retry visibility" : "Hide encrypted content"}
                                      </Button>
                                      <BaseText size="xs" color="text-muted">
                                          {captureProtection === "screenshot" ? "Hidden" : captureProtection === "ready" ? "Visible" : "Updating…"}
                                      </BaseText>
                                  </section>

                                  {readyIdentity && (
                                      <section className="pc-secure-modal-section">
                                          <Heading tag="h5">Reset identity</Heading>
                                          <Checkbox value={confirmRotation} disabled={busy} onChange={(_event, checked) => setConfirmRotation(checked)} size={20}>
                                              <BaseText size="xs">Disable protected conversations and require re-verification.</BaseText>
                                          </Checkbox>
                                          <Button size="small" variant="dangerPrimary" disabled={!confirmRotation || busy} onClick={() => void rotate()}>
                                              Rotate identity
                                          </Button>
                                      </section>
                                  )}
                              </>
                          )}

                          {busy && <BaseText size="xs" color="text-muted">Working…</BaseText>}
                          {error && <BaseText size="sm" className="pc-secure-status-danger">{error}</BaseText>}
                      </div>
                  </Modal>
              );
          }'''
          renderer = regex_once(
              renderer,
              r'function ConversationManager\(\{ channel, modalProps \}: ConversationManagerProps\) \{.*?\n\}(?=\n\nfunction openConversationManager)',
              manager,
              'compact integrated Secure Messaging modal',
              re.S,
          )
          renderer_path.write_text(renderer)

          native_test_path = Path('scripts/testSecureMessagingNative.ts')
          native_test = native_test_path.read_text()
          native_test = replace_once(
              native_test,
              '''                export const BrowserWindow = {
              getAllWindows: () => runtime.browserWindows ?? [],
          };
          export const app = {
          ''',
              '''                export const BrowserWindow = {
              fromWebContents: () => null,
              getAllWindows: () => runtime.browserWindows ?? [],
          };
          export const session = {
              fromPartition: () => ({
                  setPermissionRequestHandler() {},
                  async clearStorageData() {},
              }),
          };
          export const app = {
          ''',
              'native-test Electron PRF stubs',
          )
          native_test_path.write_text(native_test)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          if package['version'] != '1.15.1.5':
              raise SystemExit(f"unexpected package version {package['version']}")
          package['version'] = '1.15.1.6'
          package_path.write_text(json.dumps(package, indent=4, ensure_ascii=False) + '\n')

          marker_path = Path('src/components/settings/tabs/plugins/newPluginRelease.ts')
          marker = marker_path.read_text().replace('version: "1.15.1.5"', 'version: "1.15.1.6"')
          marker_path.write_text(marker)
          marker_test_path = Path('scripts/testPluginReleaseMarkers.ts')
          marker_test = marker_test_path.read_text().replace(
              'getReleaseNewPlugins("1.15.1.6", ["AutoJumpToMessage"])',
              'getReleaseNewPlugins("1.15.1.7", ["AutoJumpToMessage"])',
          )
          marker_test_path.write_text(marker_test)

          old_plugin = Path('src/equicordplugins/secureMessagingSecurityKey.desktop')
          if old_plugin.exists():
              for child in old_plugin.iterdir():
                  child.unlink()
              old_plugin.rmdir()

          for cleanup in [
              '.github/workflows/generate-security-key-vault.yml',
              '.trigger-security-key-vault',
          ]:
              Path(cleanup).unlink(missing_ok=True)
          PY

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused security-key checks
        run: |
          pnpm lint:fix
          pnpm testSecureMessagingSecurityKey
          pnpm testSecureMessagingNative
          pnpm testTsc
          pnpm lint-styles

      - name: Run complete verification gate
        run: |
          pnpm test
          pnpm build
          pnpm testWeb
          git diff --check

      - name: Commit exact verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProtonnCord Nightly CI"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use a security key to protect Secure Messaging E2E keys" \
            -m "Wrap the Secure Messaging vault with a WebAuthn PRF-derived AES-GCM key, require the physical key to unlock encryption and decryption, integrate setup and lock controls into the existing modal, remove the second chat-bar icon and old proof plugin, reduce modal text, and bump nightly to 1.15.1.6."
          git push --force-with-lease origin HEAD:refs/heads/feature/security-key-vault

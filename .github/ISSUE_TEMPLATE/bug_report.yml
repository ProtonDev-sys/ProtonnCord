name: Bug/Crash Report
description: Create a bug or crash report for Protonn Cord.
labels: [bug]
title: "[Bug] <title>"

body:
    - type: markdown
      attributes:
          value: |
              Report Protonn Cord issues here, including broken plugins. Search existing issues first.
              Include the plugin name and the steps needed to reproduce the problem.
              Remove tokens, private message content, and other personal data from any logs you share.

    - type: textarea
      id: build-details
      attributes:
          label: Build and environment
          description: Include your Protonn Cord version/commit and update branch, Discord version/channel, operating system, and installation method.
      validations:
          required: true

    - type: textarea
      id: bug-description
      attributes:
          label: What happens when the bug or crash occurs?
          description: Where does this bug or crash occur, when does it occur, etc.
          placeholder: The bug/crash happens sometimes when I do ..., causing this to not work/the app to crash. I think it happens because of ...
      validations:
          required: true

    - type: textarea
      id: expected-behaviour
      attributes:
          label: What is the expected behaviour?
          description: Simply detail what the expected behaviour is.
          placeholder: I expect Protonn Cord/Discord to open the ... page instead of ..., it prevents me from doing ...
      validations:
          required: true

    - type: textarea
      id: steps-to-take
      attributes:
          label: How do you recreate this bug or crash?
          description: Give us a list of steps in order to recreate the bug or crash.
          placeholder: |
              1. Do ...
              2. Then ...
              3. Do this ..., ... and then ...
              4. Observe "the bug" or "the crash"
      validations:
          required: true

    - type: textarea
      id: crash-log
      attributes:
          label: Errors
          description: Open the Developer Console with `Ctrl+Shift+i` / `Cmd+Option+i`. Then look for any red errors (Ignore network errors like Failed to load resource) and paste them between the "```".
          value: |
              ```
              Replace this text with your crash-log.
              ```
      validations:
          required: false

    - type: checkboxes
      id: agreement-check
      attributes:
          label: Request Agreement
          description: State which Discord channel is affected and whether you could also reproduce it on Stable.
          options:
              - label: I've searched existing issues and this hasn't been reported before
              - label: I am using Discord Stable or tried on Stable and this bug happens there as well
              - label: I have included my Protonn Cord build and installation details
              - label: I am willing to submit a fix for this myself

title = "Protonn Cord reviewed public constants and synthetic fixtures"

[extend]
useDefault = true

[[allowlists]]
description = "Reviewed public API constant, schema/badge identifier, or deterministic test vector"
condition = "AND"
regexTarget = "match"
paths = ['''(?:docs/plugin-catalog-baseline|scripts/fixtures/plugin-catalog-baseline)\.json$''']
regexes = ['''^bypassDiscordUpload","bypassDiscordUploadOnlyOverLimit"$''']


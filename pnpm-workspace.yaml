packages:
    - packages/*
overrides:
    "brace-expansion@>=1.0.0 <1.1.21": "1.1.21"
    "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
    "source-map-js@<1.2.2": "1.2.2"
    "postcss-selector-parser@<7.1.6": "7.1.6"
    "stylelint@17.16.0>fast-glob": "-"
    "stylelint@17.16.0>globby": "-"
    "stylelint@17.16.0>globjoin": "-"
    "stylelint@17.16.0>micromatch": "-"
packageExtensions:
    stylelint@17.16.0:
        dependencies:
            picomatch: "4.0.7"
            tinyglobby: "0.2.17"
patchedDependencies:
    stylelint@17.16.0: patches/stylelint@17.16.0.patch
peerDependencyRules:
    ignoreMissing:
        - eslint-plugin-import
        - eslint
allowedDeprecatedVersions:
    source-map-resolve: "*"
    resolve-url: "*"
    source-map-url: "*"
    urix: "*"
    q: "*"
strictPeerDependencies: false
allowBuilds:
    esbuild: true
pmOnFail: warn
verifyDepsBeforeRun: prompt
minimumReleaseAge: 7
minimumReleaseAgeExclude:
    - "@song-spotlight/api"
